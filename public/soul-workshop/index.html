  var interpretation='';
  if(topConcepts.length>0){
    var conceptMap={暴力:'有暴力发生',伤害:'有人受伤了',痛苦:'有人很痛苦',危险:'有危险',未知:'情况不明',冲突:'起了冲突',不公:'这不公平',犯罪:'有人在作恶',财富:'跟钱有关',援助:'需要帮忙',悲伤:'很悲伤',恐惧:'让人害怕',损失:'有损失',社交:'跟人打交道',消息:'有新消息',搜寻:'在找什么',异常:'不太对劲',威胁:'有威胁',机会:'可能有好处',外来者:'有外人来了',脆弱:'有人很脆弱',合作:'需要合作',交易:'有交易',黑暗:'环境危险',聚集:'人多的地方',日常:'日常小事',神秘:'很神秘',紧急:'事情紧急',秘密:'有秘密',权威:'涉及权威',资源:'涉及资源',失去:'有所失去',不变:'很平常',灾难:'重大灾难发生了',破坏:'破坏性事件',疾病:'有人生病了',野兽:'有野兽出没',英雄:'需要英雄站出来',终结:'已经结束了',仪式:'有仪式',逃避:'有人在逃避',安全:'安全第一',希望:'有希望',冒险:'有风险',自由:'自由了',不受控:'失控了',分离:'分开了',归属:'归属感',远处:'远处发生了事',自然:'自然的力量',屏障:'有屏障'};
    interpretation=topConcepts.map(function(c){return conceptMap[c]||c;}).join('，');
  }
  return {keywords:keywords,concepts:topConcepts,dominantEmotion:dominantEmotion,emotionAct:emotionAct,interpretation:interpretation,subject:extractSubject(text)};
}
function extractSubject(text){
  var words=text.replace(/[，。！？、\s\[\]]/g,'');
  var m=words.match(/(.{2,6})(?:在|来|去|到|走|跑|坐|站|躺|看|说|喊|哭|笑|打|偷|吵|找|丢|拿|感觉|觉得|认为)/);
  return m?m[1]:'这件事';
}

// ═══════════════ 记忆反馈闭环 ═══════════════
// ═══════════════ 观点形成系统 ═══════════════
// 每个NPC对事件形成自己的"看法"——同一个事件，不同性格看到不同东西
function formOpinion(npc,event){
  var p=npc.personality;var evtText=event.text||'';
  var evtWords=evtText.replace(/[，。！？、\s\[\]]/g,'');
  var subMatch=evtWords.match(/(.{2,6})(?:在|来|去|到|走|跑|坐|站|躺|看|说|喊|哭|笑|打|偷|吵|找|丢|拿)/);
  var subject=subMatch?subMatch[1]:'这件事';
  var interpretations=[];
  if(p.正义>70)interpretations.push({text:'这不公平，得有人管',stance:'righteous',emo:{anger:4,happiness:-2}});
  if(p.善良>70)interpretations.push({text:subject+'挺可怜的，需要帮助',stance:'compassionate',emo:{anger:0,happiness:2}});
  if(p.贪婪>70)interpretations.push({text:'说不定有利可图',stance:'opportunistic',emo:{anger:0,happiness:3}});
  if(p.暴躁>70)interpretations.push({text:'烦死了，又来事',stance:'irritated',emo:{anger:6,happiness:-3}});
  if(p.好奇>70)interpretations.push({text:subject+'？有意思，得搞清楚',stance:'curious',emo:{anger:0,happiness:2}});
  if(p.勇敢>70)interpretations.push({text:'没什么好怕的',stance:'brave',emo:{anger:0,happiness:1}});
  if(p.沉默>70)interpretations.push({text:'……（默默观察）',stance:'observant',emo:{anger:0,happiness:0}});
  if(p.懒惰>70)interpretations.push({text:'关我什么事，别找我',stance:'indifferent',emo:{anger:0,happiness:0}});
  if(interpretations.length===0)interpretations.push({text:'先看看再说',stance:'neutral',emo:{anger:0,happiness:0}});
  
  // 灾难/紧急事件专用观点模板：事件严重度>50时触发，让NPC理解"发生了什么"
  if(event.severity>50){
    var disasterText=evtText.indexOf('火')>=0||evtText.indexOf('烧')>=0?'那片火光':evtText.indexOf('灾')>=0?'这场灾难':evtText.indexOf('震')>=0?'这天灾':evtText.indexOf('水')>=0&&evtText.indexOf('洪')>=0?'这场洪水':evtText.indexOf('病')>=0||evtText.indexOf('疫')>=0?'这瘟疫':evtText.indexOf('乱')>=0||evtText.indexOf('斗')>=0?'这乱子':'这变故';
    if(p.正义>50)interpretations.push({text:disasterText+'不能不管，得赶紧去看看',stance:'righteous',emo:{anger:2,urgency:6}});
    if(p.善良>50)interpretations.push({text:disasterText+'会伤到人，得想办法帮忙',stance:'compassionate',emo:{fear:3,urgency:5,sympathy:4}});
    if(p.勇敢>50)interpretations.push({text:disasterText+'虽然危险，但总得有人去',stance:'brave',emo:{fear:2,urgency:4}});
    if(p.好奇>50)interpretations.push({text:disasterText+'到底怎么回事？得搞清楚',stance:'curious',emo:{curiosity:4,urgency:3}});
    if(p.沉默>60)interpretations.push({text:disasterText+'……（心里发慌，但不敢说）',stance:'observant',emo:{fear:5,urgency:3}});
    if(p.懒惰>60)interpretations.push({text:disasterText+'离得远，跟我没关系吧……',stance:'indifferent',emo:{fear:2,relief:1}});
    if(p.社交>50)interpretations.push({text:disasterText+'得赶紧告诉村里人，让大家知道',stance:'social',emo:{urgency:5,curiosity:3}});
    // 灾难事件也触发所有人的恐惧基础反应
    if(interpretations.length<=2){ // 如果上面没加几条，说明性格不匹配，但灾难还是会让人害怕
      interpretations.push({text:disasterText+'……太吓人了，该怎么办',stance:'fearful',emo:{fear:6,urgency:5}});
    }
  }
  
  // 情景记忆引用：25%概率从往事中匹配当前事件，形成"上次也…"的关联观点
  if(npc.memories&&npc.memories.length>0&&Math.random()<.25){
    // 从事件中提取关键词
    var kwMap={丢:['丢','掉','没了','不见'],偷:['偷','抢','拿','顺'],钱:['钱','银','财','袋','包'],打:['打','斗','伤','血'],帮:['帮','救','扶','助'],骂:['骂','说','传','话'],陌生:['陌生','外人','可疑','村口'],来:['来','到','进','出现']};
    var matchedKws=[];
    for(var kw in kwMap){
      for(var i=0;i<kwMap[kw].length;i++){
        if(evtText.indexOf(kwMap[kw][i])>=0){matchedKws.push(kw);break;}
      }
    }
    // 在记忆中搜索匹配关键词的事件
    var relMems=[];
    npc.memories.forEach(function(m){
      var memText=m.text||'';
      for(var k=0;k<matchedKws.length;k++){
        var kw=matchedKws[k];var kwList=kwMap[kw];
        for(var j=0;j<kwList.length;j++){
          if(memText.indexOf(kwList[j])>=0){relMems.push(m);return;}
        }
      }
    });
    // 如果找到匹配记忆，生成情景引用观点
    if(relMems.length>0){
      var refMem=relMems[Math.floor(Math.random()*relMems.length)];
      var memAge=engineTick-(refMem.t||0);
      var ageDesc=memAge<5?'刚刚':memAge<15?'之前':'以前';
      var refText='跟'+ageDesc+'「'+refMem.text+'」那回一样，这次也……';
      interpretations.push({text:refText,stance:'memory_ref',emo:{anger:refMem.em<0?2:0,happiness:refMem.em>0?1:0},refMemory:refMem});
    }
  }
  // 抽象记忆引用：如果对事件涉及的人物有抽象印象，也加入观点
  if(npc.abstractMemory&&npc.abstractMemory.length>0&&Math.random()<.2){
    var targetName=event.target?getNPC(event.target):null;
    if(targetName){
      npc.abstractMemory.forEach(function(a){
        if(a.subject===targetName.name&&a.confidence>50){
          var abText='我早就觉得'+targetName.name+(a.valence==='negative'?'不太靠谱，得防着点':a.valence==='positive'?'人还不错':'有点拿不准');
          interpretations.push({text:abText,stance:'abstract_mem',emo:{anger:a.valence==='negative'?3:0,happiness:a.valence==='positive'?2:0},refAbstract:a});
        }
      });
    }
  }
  
  var totalWeight=0;var weighted=[];
  interpretations.forEach(function(ip,i){var w=i===0?3:1;totalWeight+=w;weighted.push({ip:ip,w:totalWeight});});
  var rand=Math.random()*totalWeight;var chosen=null;
  for(var i=0;i<weighted.length;i++){if(rand<=weighted[i].w){chosen=weighted[i].ip;break;}}
  if(!chosen)chosen=interpretations[0];
  var opinion={eventText:evtText,subject:subject,interpretation:chosen.text,stance:chosen.stance,emo:chosen.emo,tick:engineTick,action:null,hasMemoryRef:!!chosen.refMemory};
  if(chosen.refMemory)opinion.refMemory=chosen.refMemory;
  var dup=npc.opinions.find(function(o){return o.eventText===evtText;});
  if(!dup){npc.opinions.push(opinion);if(npc.opinions.length>10)npc.opinions.shift();}
  return opinion;
}
function getMemoryBias(npc,targetId,aid){
  if(!targetId)return 0;
  var bias=0;
  npc.memories.forEach(function(m){
    if(m.targetId===targetId){
      // 记忆时间衰变因子 (越久远影响越小，每Tick衰减5%)
      var age=engineTick-m.t;
      var decay=Math.max(.1,1-age*.05);
      // 友好行为：痛苦记忆大幅减分
      if(['help','share','mediate','sympathize'].indexOf(aid)>=0){
        bias+=m.em*decay*.5;
      }
      // 敌对行为：痛苦记忆大幅加分
      if(['confront','reject','exploit','claim','deny','gossip'].indexOf(aid)>=0){
        bias-=m.em*decay*.8;
      }
    }
  });
  return bias;
}

// ═══════════════ 维度四：认知失调系统 ═══════════════
// 人类在被迫做出违背自身原则的选择后，会产生痛苦并试图自我合理化
// 这种心理机制决定了人类行为的长期连续性
function trackDissonance(npc,aid,event){
  var p=npc.personality;var a=ACTIONS[aid];if(!a)return;
  // 检测行为是否与核心人格冲突
  var conflicts=[];
  // 高善良做自私行为 → 内疚
  if(p.善良>70&&(aid==='exploit'||aid==='claim'||aid==='ignore')){
    conflicts.push({type:'guilt',against:'善良',severity:(p.善良-50)*.8,target:event.target||null});
  }
  // 高正义做不公行为 → 内疚
  if(p.正义>65&&(aid==='exploit'||aid==='deny'||aid==='ignore')){
    conflicts.push({type:'guilt',against:'正义',severity:(p.正义-50)*.6,target:event.target||null});
  }
  // 高勇敢做懦弱行为 → 羞耻
  if(p.勇敢>60&&aid==='hide'&&(event.severity||0)<50){
    conflicts.push({type:'shame',against:'勇敢',severity:(p.勇敢-40)*.5,target:event.target||null});
  }
  // 高社交做冷漠行为 → 不安
  if(p.社交>60&&(aid==='ignore'||aid==='hide')){
    conflicts.push({type:'discomfort',against:'社交',severity:(p.社交-50)*.4,target:event.target||null});
  }
  if(conflicts.length===0)return;
  // 记录失调标记
  conflicts.forEach(function(c){
    npc.dissonance.push({
      type:c.type,
      against:c.against,
      severity:c.severity,
      target:c.target,
      tick:engineTick,
      action:aid,
      eventText:event.text||''
    });
    // 立即情绪影响：内疚降低幸福感
    if(c.type==='guilt')npc.happiness=clamp(npc.happiness-c.severity*.3,0,100);
    if(c.type==='shame')npc.happiness=clamp(npc.happiness-c.severity*.2,0,100);
  });
  // 限制失调标记数量
  if(npc.dissonance.length>10)npc.dissonance=npc.dissonance.slice(-10);
  // ═══════════ 盲区一：严重内疚转化长线承诺 ═══════════
  // 不只是"接下来帮帮忙"，而是"我要在未来X天内做一件具体的事来弥补"
  conflicts.forEach(function(c){
    if(c.type==='guilt'&&c.severity>25&&c.target){
      // 对目标欠了人情：承诺补偿
      var targetName=(getNPC(c.target)||{}).name||'那个人';
      var purpose=targetName+'害我产生内疚，我要补偿';
      createCommitment(npc,c.type+'_补偿',c.target,purpose,70,25);
    }
  });
}

// 认知失调补偿：在后续行为评分中，内疚/羞耻驱动补偿行为
function getDissonanceBias(npc,targetId,aid){
  if(!npc.dissonance||npc.dissonance.length===0)return 0;
  var bias=0;
  npc.dissonance.forEach(function(d){
    // 只考虑近期的失调（3 tick内）
    if(engineTick-d.tick>3)return;
    var decay=1-(engineTick-d.tick)*.3; // 随时间衰减
    if(decay<=0)return;
    // 对内疚目标的补偿行为：帮助/分享/安慰
    if(d.target&&d.target===targetId&&d.type==='guilt'){
      if(aid==='help')bias+=d.severity*decay*.5;
      if(aid==='share')bias+=d.severity*decay*.4;
      if(aid==='sympathize')bias+=d.severity*decay*.3;
    }
    // 羞耻驱动勇敢行为
    if(d.type==='shame'){
      if(aid==='confront')bias+=d.severity*decay*.3;
      if(aid==='investigate')bias+=d.severity*decay*.25;
      if(aid==='hide')bias-=d.severity*decay*.4; // 不敢再躲
    }
  });
  return bias;
}

// ═══════════════ 优化5：事后反思机制 ═══════════════
// 人在事件结束后会反思自己的行为，这种反思会影响未来的行为
// "我当时应该跑得更快""我为什么那么懦弱"——这些反思改变人的行为模式
function triggerAftermathReflection(npc){
  if(!npc.reflections)npc.reflections=[];
  var lastAction=npc.currentAction||'';
  var fearLevel=npc.emotionalState.fear;
  var urgencyLevel=npc.emotionalState.urgency;
  // 反思类型
  var reflectionType='';
  var reflectionText='';
  if(fearLevel>60&&lastAction==='hide'){
    reflectionType='cowardice';
    reflectionText='回忆起刚才的恐惧，觉得自己太懦弱了';
    // 未来类似事件中勇敢度临时提升
    npc.reflections.push({type:'cowardice',tick:engineTick,impact:{勇敢:+8},text:'我不能再这么懦弱了'});
  }else if(fearLevel>40&&lastAction==='help'){
    reflectionType='pride';
    reflectionText='虽然后怕，但庆幸自己帮上了忙';
    npc.reflections.push({type:'pride',tick:engineTick,impact:{善良:+3,勇敢:+3},text:'我做了正确的事'});
  }else if(urgencyLevel>50&&lastAction==='report'){
    reflectionType='duty_fulfilled';
    reflectionText='及时通报了危险，尽到了责任';
    npc.reflections.push({type:'duty_fulfilled',tick:engineTick,impact:{正义:+2},text:'尽到了责任'});
  }else if(fearLevel>70){
    reflectionType='trauma';
    reflectionText='那段经历太可怕了，短时间内难以释怀';
    npc.reflections.push({type:'trauma',tick:engineTick,impact:{勇敢:-5,沉默:+5},text:'太可怕了...'});
  }
  if(reflectionType){
    npc.happiness=clamp(npc.happiness-(reflectionType==='trauma'?8:2),0,100);
    if(npc.reflections.length>10)npc.reflections=npc.reflections.slice(-10);
    // ═══════════ 盲区一：深度反思转化长线承诺 ═══════════
    // 懦弱后悔 → 承诺"下次遇到危险要勇敢站出来"
    if(reflectionType==='cowardice'){
      createCommitment(npc,'变得勇敢','',npc.name+'决心不再懦弱，下次危险要站出来',75,30);
    }
    // 创伤 → 承诺"加强村庄安全"（如果有权责）
    if(reflectionType==='trauma'&&(npc.role==='村长'||npc.role==='侠客')){
      createCommitment(npc,'加强安全','',npc.name+'决心加强村庄防御，防止悲剧重演',80,50);
    }
  }
  // 反思后情绪自然回落
  npc.emotionalState.relief=clamp(npc.emotionalState.relief+20,0,100);
}

// 获取反思对当前行为的偏置
function getReflectionBias(npc,aid){
  if(!npc.reflections||npc.reflections.length===0)return 0;
  var bias=0;
  npc.reflections.forEach(function(r){
    if(engineTick-r.tick>8)return; // 反思8 tick后失效
    var decay=1-(engineTick-r.tick)*.12;
    if(decay<=0)return;
    if(r.type==='cowardice'){
      if(aid==='hide')bias-=10*decay; // 不敢再躲
      if(aid==='confront'||aid==='investigate')bias+=6*decay; // 想要证明自己
    }
    if(r.type==='trauma'){
      if(aid==='investigate'||aid==='confront')bias-=8*decay; // 创伤后回避
      if(aid==='hide')bias+=5*decay;
    }
    if(r.type==='pride'){
      if(aid==='help'||aid==='share')bias+=4*decay; // 助人行为强化
    }
  });
  return bias;
}

// ═══════════════ 盲区一：长线承诺队列 ═══════════════
// 人类在经历重大事件后产生的不只是短期数值偏置，而是跨越数天、多步骤的长线项目
// 阿福在火灾中没能救出铁匠铺工具 → 不只是"接下来多帮帮人"，而是"3天内无偿打制农具送给村民"
function createCommitment(npc,name,targetId,purpose,priority,ticksToComplete){
  // ═══════════ 承诺过载保护：上限2个，超出时动态放弃低优先级旧承诺 ═══════════
  if(npc.commitments.length>=2){
    // 找最低优先级旧承诺
    var lowest=null,lowestIdx=-1;
    npc.commitments.forEach(function(c,i){
      if(!lowest||c.priority<lowest.priority){lowest=c;lowestIdx=i;}
    });
    // 新承诺优先级更高 → 放弃旧承诺
    if(lowest&&priority>lowest.priority+10){
      // 放弃旧承诺产生轻微内疚
      npc.happiness=clamp(npc.happiness-3,0,100);
      if(!npc.dissonance)npc.dissonance=[];
      npc.dissonance.push({type:'guilt',against:'承诺',severity:15,target:lowest.targetId||null,tick:engineTick,action:'abandon',eventText:'放弃了承诺：'+lowest.purpose});
      npc.commitments.splice(lowestIdx,1);
    }else{
      return; // 新承诺优先级不够，不创建
    }
  }
  npc.commitments.push({
    id:'cmt_'+engineTick+'_'+Math.random().toString(36).substr(2,4),
    name:name,
    targetId:targetId,
    purpose:purpose,
    progress:0,
    total:ticksToComplete,
    priority:priority||50,
    expireTick:engineTick+ticksToComplete+20,
    createdAt:engineTick
  });
}

// 每 tick 推进承诺进度。空闲时优先调度高优先级承诺
function processCommitments(npc){
  if(!npc.commitments||npc.commitments.length===0)return;
  // 清理过期承诺
  npc.commitments=npc.commitments.filter(function(c){return engineTick<c.expireTick;});
  if(npc.commitments.length===0)return;
  // 注意力被锁定时暂停承诺推进
  if(isDistracted(npc))return;
  // 按优先级排序，推进最高优先级承诺
  npc.commitments.sort(function(a,b){return b.priority-a.priority;});
  var active=npc.commitments[0];
  // 内疚驱动的承诺推进更快（补偿心理）
  var hasDissonance=npc.dissonance&&npc.dissonance.some(function(d){return engineTick-d.tick<3;});
  var progressRate=hasDissonance?2.5:1.0;
  // 勤劳/懒惰影响推进速度
  progressRate+=npc.personality.勤劳*.015-npc.personality.懒惰*.015;
  active.progress=Math.min(active.progress+progressRate,active.total);
  // 承诺完成时触发事件
  if(active.progress>=active.total){
    npc.happiness=clamp(npc.happiness+5,0,100);
    if(active.targetId){
      var target=getNPC(active.targetId);
      if(target&&REL[npc.id]&&REL[npc.id][active.targetId]){
        REL[npc.id][active.targetId].t=clamp(REL[npc.id][active.targetId].t+5,0,100);
      }
    }
    // 完成承诺后清除关联失调
    if(npc.dissonance&&npc.dissonance.length>0){
      npc.dissonance=npc.dissonance.filter(function(d){
        return !(d.target===active.targetId&&d.type==='guilt');
      });
    }
    npc.commitments=npc.commitments.filter(function(c){return c.id!==active.id;});
  }
}

// ═══════════════ 盲区二：群聚心理与旁观者效应 ═══════════════
// 人类在群体中的行为不等于独立个体的行为之和
// 旁观者效应：围观的人越多且没人带头，出手意愿下降
// 恐慌传染：周围逃跑/惊慌的人越多，个体恐惧值暴涨
function getCrowdEffect(npc,event,nearbyIds){
  if(!nearbyIds||nearbyIds.length<=1)return {inhibition:0,panicContagion:0,leaderBoost:0};
  var panicCount=0,leaderCount=0,myTrust=0;
  nearbyIds.forEach(function(id){
    if(id===npc.id)return;
    var other=getNPC(id);if(!other)return;
    // 恐慌传染计数
    if(other.mood==='angry'||other.attentionLocked||other.lastAction==='hide')panicCount++;
    // 带头人计数（有人率先出手帮助/调查/报告）
    if(other.lastAction==='help'||other.lastAction==='investigate'||other.lastAction==='report')leaderCount++;
    // 我对这个人的信任度（加权）
    if(REL[npc.id]&&REL[npc.id][id])myTrust+=REL[npc.id][id].t;
  });
  var n=Math.max(nearbyIds.length-1,1);
  // 旁观者效应：周围≥3人且没人带头 → 出手意愿下降
  var inhibition=0;
  if(n>=3&&leaderCount===0){
    // 基础旁观者效应：人越多，责任分散越严重
    var rawInhibition=-20*(n/5);
    // 忍受极限阈值：危险随时间推移线性累积，最终强行打破沉默
    // event.severity 越高，打破沉默越快
    var breakthroughPressure=Math.min((event.severity||0)*.01,1.0);
    // 每个 tick 的累积压力：用 engineTick 避免静态锁死
    var elapsedTicks=engineTick%100; // 用引擎 tick 模拟时间累积
    var pressure=Math.min(elapsedTicks*breakthroughPressure*.5,1.0);
    // 压力增大时，旁观者效应逐渐减弱
    inhibition=Math.round(rawInhibition*(1-pressure));
    // 责任特质调节：高正义的人受旁观者效应影响更小
    inhibition=Math.round(inhibition*(1-(npc.personality.正义-50)*.005));
  }
  // 恐慌传染：≥2人逃跑/惊慌 → 恐惧值临时暴涨
  var panicContagion=0;
  if(panicCount>=2){
    panicContagion=25*(panicCount/n);
    // 勇敢者对抗恐慌传染
    panicContagion*=(1-(npc.personality.勇敢-50)*.008);
  }
  // 带头人效应：有人带头出手 → 从众心理驱动跟随
  var leaderBoost=0;
  if(leaderCount>=1){
    leaderBoost=15*leaderCount;
    // 社交性高的人更容易跟随
    leaderBoost*=npc.personality.社交/50;
    // 但如果带头人是自己信任的人，跟随意愿更强
    var avgTrust=myTrust/n;
    if(avgTrust>50)leaderBoost*=1.3;
  }
  return {inhibition:Math.round(inhibition),panicContagion:Math.round(panicContagion),leaderBoost:Math.round(leaderBoost)};
}

// ═══════════════ 盲区三：二级心智推测（Theory of Mind） ═══════════════
// 人类决策不仅基于"我喜不喜欢他"，更基于"他喜不喜欢我"和"他怎么看我的行为"
// 书生不敢逃不是因为不勇敢，而是因为"小翠在看着，她会觉得我懦弱"
function getMetaReputationCost(npc,actionId,spectators){
  if(!spectators||spectators.length===0)return 0;
  var cost=0;
  spectators.forEach(function(sid){
    if(sid===npc.id)return;
    var spectator=getNPC(sid);if(!spectator)return;
    // 我对这个在场者的好感度（我想在他面前保持形象）
    var myAffectionForThem=REL[npc.id]&&REL[npc.id][sid]?REL[npc.id][sid].t:50;
    if(myAffectionForThem<60)return; // 不在意的人，不产生形象成本
    // 懦弱行为在在意的人面前 → 巨大形象成本
    if(actionId==='hide'||actionId==='deny'){
      cost-=35*(myAffectionForThem/100);
      // 如果NPC沉默，额外羞耻（沉默的人更在意面子）
      if(npc.personality.沉默>60)cost-=10*(npc.personality.沉默/100);
    }
    // 不道德行为在在意的人面前 → 形象成本
    if(actionId==='exploit'||actionId==='gossip'){
      cost-=20*(myAffectionForThem/100);
      // 善良的人做坏事的心理成本更高
      if(npc.personality.善良>60)cost-=15*(npc.personality.善良/100);
    }
    // 利他行为在在意的人面前 → 形象收益（想表现好）
    if(actionId==='help'||actionId==='share'||actionId==='sympathize'){
      cost+=15*(myAffectionForThem/100);
    }
    // 二阶推测："对方是否也喜欢我" → 双向好感时形象成本翻倍
    var theirAffectionForMe=REL[sid]&&REL[sid][npc.id]?REL[sid][npc.id].t:50;
    if(myAffectionForThem>60&&theirAffectionForMe>60){
      cost*=1.5; // 双向好感，我更在意他怎么看我了
    }
  });
  return Math.round(cost);
}

// ═══════════════ 盲区四：空间摩擦与执行期 ═══════════════
// 人类行为不是瞬间完成的。决定救火→跑步到达火场之间有时间和空间
// 在这段时间里，体力消耗、环境恶化都会导致心理动摇
function initPositions(){
  NPCS.forEach(function(npc,i){
    // 优先从 3D 渲染节点同步位置（如果有的话），否则用逻辑坐标
    var node=npcNodes&&npcNodes.length>i?npcNodes[i]:null;
    if(node&&node.mesh){
      npc.position={x:node.mesh.position.x,y:node.mesh.position.y};
    }else{
      var angle=(i/NPCS.length)*Math.PI*2;
      npc.position={x:Math.cos(angle)*3,y:Math.sin(angle)*3};
    }
    NPC_POSITIONS[npc.id]=npc.position;
  });
}
// 计算两个NPC之间的距离（优先使用 3D 实际位置）
function getDistance(idA,idB){
  var a=getNPC(idA),b=getNPC(idB);
  if(!a||!b)return 999;
  // 尝试从 3D 节点获取实时位置
  var nodeA=npcNodes&&npcNodes.find(function(n){return n.mesh.userData.npcId===idA;});
  var nodeB=npcNodes&&npcNodes.find(function(n){return n.mesh.userData.npcId===idB;});
  var ax=nodeA?nodeA.mesh.position.x:a.position.x;
  var ay=nodeA?nodeA.mesh.position.y:a.position.y;
  var bx=nodeB?nodeB.mesh.position.x:b.position.x;
  var by=nodeB?nodeB.mesh.position.y:b.position.y;
  var dx=ax-bx,dy=ay-by;
  return Math.sqrt(dx*dx+dy*dy);
}
// 行为执行期：高严重度行为分三阶段
function executeActionWithPhase(npc,actionId,event){
  var dist=event.target?getDistance(npc.id,event.target):0;
  // 阶段1：承诺（Commitment）—— 心理决定
  npc.energy=clamp(npc.energy-2,0,100); // 决策消耗心力
  var transitCost=dist*5; // 移动消耗体力
  // 阶段2：移动（Transit）—— 物理到达
  // 如果距离较远，途中可能动摇
  if(dist>2&&npc.emotionalState.fear>40){
    // 恐惧在途中加剧：烟雾变大、体力消耗
    var reEvalChance=Math.min(npc.emotionalState.fear*.01,0.4);
    if(Math.random()<reEvalChance){
      // 二次动摇：放弃原计划
      npc.emotionalState.fear=clamp(npc.emotionalState.fear+10,0,100);
      return {actionId:'hide',phase:'aborted',reason:'途中恐惧加剧，放弃了原计划'};
    }
  }
  // 阶段3：执行（Execution）—— 最终行动
  npc.energy=clamp(npc.energy-transitCost,0,100);
  // 资源冲突：高贪婪NPC在危险中可能面临"救人还是救财产"的抉择
  if(npc.personality.贪婪>50&&event.type==='danger'&&Math.random()<.3){
    // 贪婪驱动：试图抢救财产，虽然危险
    npc.happiness=clamp(npc.happiness-3,0,100); // 内心挣扎
    npc.emotionalState.fear=clamp(npc.emotionalState.fear+5,0,100);
    return {actionId:actionId,phase:'conflicted',reason:'在救人和救财产之间痛苦挣扎'};
  }
  return {actionId:actionId,phase:'executed',reason:'到达现场，开始行动'};
}

// ═══════════════ 优化1：目标中断挫败感 ═══════════════
// 当NPC正在执行长线承诺时被突发高严重度事件打断
// 不应只是"静默暂停"，而是根据性格产生挫败值，影响后续决策语气
function applyGoalDisruptionFriction(npc){
  if(!npc.commitments||npc.commitments.length===0)return;
  // 找到当前正在推进的承诺（进度最高且未完成的）
  var active=npc.commitments.reduce(function(best,c){
    return(!best||c.progress>best.progress)?c:best;
  },null);
  if(!active||active.progress<10)return; // 刚开始的承诺被打断不太在意
  // 进度越高、尽责性越高，挫败感越强
  var progressRatio=active.progress/active.total;
  var frustrationAdded=Math.floor(npc.personality.勤劳*.3+progressRatio*40);
  if(npc.frustration===undefined)npc.frustration=0;
  npc.frustration+=frustrationAdded;
  // 挫败感临时提升暴躁值与愤怒值
  npc.anger=clamp(npc.anger+Math.floor(frustrationAdded*.4),0,100);
  // 如果这是第N次被打断，累积效应更强
  if(npc.frustration>40){
    npc.anger=clamp(npc.anger+5,0,100); // 烦躁累积
    npc.happiness=clamp(npc.happiness-3,0,100);
  }
}

// ═══════════════ 优化2：意图误读机制 ═══════════════
// 旁观者观察到其他NPC的行为时，不直接读取真实意图
// 而是将行为归类为表象动作，结合信任度/偏见来推测意图
function interpretObservedAction(observerId,actorId,rawAction,eventContext){
  var trust=REL[observerId]&&REL[actorId]?REL[observerId][actorId].t:50;
  // 信任度低(<40)：倾向于恶意曲解对方行为
  if(trust<40){
    if(rawAction==='investigate')return {interpreted:'suspicious_snooping',label:'鬼鬼祟祟打量',bias:'恶意'};
    if(rawAction==='help')return {interpreted:'show_off',label:'假慈悲作秀',bias:'恶意'};
    if(rawAction==='gossip')return {interpreted:'plotting',label:'密谋害人',bias:'恶意'};
    if(rawAction==='report')return {interpreted:'tattling',label:'打小报告',bias:'恶意'};
  }
  // 信任度高(>75)：倾向于善意理解对方行为
  if(trust>75){
    if(rawAction==='confront')return {interpreted:'righteous_defense',label:'主持公道',bias:'善意'};
    if(rawAction==='hide')return {interpreted:'tactical_retreat',label:'智取暂避',bias:'善意'};
    if(rawAction==='deny')return {interpreted:'careful_consideration',label:'谨慎斟酌',bias:'善意'};
    if(rawAction==='gossip')return {interpreted:'sharing_concern',label:'关心议论',bias:'善意'};
  }
  // 中性信任(40-75)：直接理解
  return {interpreted:rawAction,label:ACTIONS[rawAction]?ACTIONS[rawAction].name:rawAction,bias:'中性'};
}

// ═══════════════ 优化3：自我损耗与意志力递减 ═══════════════
// 即使是最勇敢的侠客，在持续高强度应激下也会意志力衰退
// 勇敢85不代表能无限期保持镇定，英雄也有心理崩溃的拐点
function getEffectiveTraits(npc){
  var effectiveBrave=npc.personality.勇敢;
  var effectiveIrritable=npc.personality.暴躁||30;
  // 持续应激损耗：每1 tick注意力锁定，有效勇敢值下降8点
  if(npc.attentionLocked&&npc.stressTicks){
    var depletion=Math.min(60,npc.stressTicks*8);
    effectiveBrave=Math.max(10,effectiveBrave-depletion);
  }
  // 残余疲劳损耗：危机后疲惫期，勇敢值打折
  if(npc.exhaustion>30){
    effectiveBrave=Math.max(10,effectiveBrave-npc.exhaustion*.4);
  }
  // 挫败感增加暴躁度
  effectiveIrritable=Math.min(100,effectiveIrritable+(npc.frustration||0)*.5);
  return {勇敢:effectiveBrave,暴躁:effectiveIrritable};
}

// ═══════════════ 优化4：期望锚定与高信任度倒错 ═══════════════
// 信任度>75时，NPC对目标建立"高期望阈值"
// 目标做出伤害行为时，好感度/信任度扣减翻倍——"亲近之人伤害最深"
function calculateRelationalDrift(observerId,actorId,actionType){
  var currentTrust=REL[observerId]&&REL[actorId]?REL[observerId][actorId].t:50;
  var baseDrift=0;
  // 伤害行为
  if(actionType==='confront'||actionType==='deny'||actionType==='exploit'||actionType==='gossip'){
    baseDrift=-8;
    // 高信任度下的期望崩塌：信任越高，失望越深
    if(currentTrust>75){
      baseDrift=Math.round(baseDrift*2.2);
    }
  }
  // 帮助行为
  else if(actionType==='help'||actionType==='share'||actionType==='sympathize'||actionType==='mediate'){
    baseDrift=+6;
    // 边际递减：已经极度信任时，继续做小好事带来的好感增加有限
    if(currentTrust>80)baseDrift=Math.round(baseDrift*.5);
  }
  return baseDrift;
}

// ═══════════════ 模块一：社群衍生暗语与文化共鸣 ═══════════════
// 共享重大事件(severity≥70)的NPC群体会凝练专属暗语
// 圈内人用代号交流，圈外人旁听时产生"可疑交头接耳"的误判
function createSubcultureGroup(event,perceivers){
  if(!event||event.severity<70||!perceivers||perceivers.length<2)return;
  var memberIds=perceivers.filter(function(p){return p&&p.id;}).map(function(p){return p.id;});
  if(memberIds.length<2)return;
  // 从事件文本中提取关键词生成暗语映射
  var aliasMap={};
  if(event.text.indexOf('火')>=0||event.text.indexOf('烧')>=0){
    aliasMap['危险']='那晚的红烟';aliasMap['火灾']='红山之变';aliasMap['逃跑']='往后山撤';
  }
  if(event.text.indexOf('兽')>=0||event.text.indexOf('狼')>=0){
    aliasMap['危险']='那晚的黑风';aliasMap['野兽']='山里的怪物';aliasMap['逃跑']='抄小路走';
  }
  if(event.text.indexOf('盗')>=0||event.text.indexOf('贼')>=0){
    aliasMap['危险']='那晚的生面孔';aliasMap['逃跑']='避一避风头';
  }
  var group={
    id:'sub_'+engineTick+'_'+Math.random().toString(36).substr(2,4),
    members:memberIds,
    aliasMap:aliasMap,
    eventText:event.text,
    createdTick:engineTick
  };
  // 注入到所有感知者的社群标记中
  perceivers.forEach(function(npc){
    if(!npc||!memberIds.includes(npc.id))return;
    npc.subcultures=npc.subcultures||[];
    // 避免重复注入
    if(!npc.subcultures.some(function(g){return g.id===group.id;})){
      npc.subcultures.push(group);
    }
  });
  // Feed输出：社群暗语形成
  var memberNames=memberIds.map(function(id){return getNPC(id)?getNPC(id).name:id;}).join('、');
  var aliasSample=Object.values(aliasMap).slice(0,2).join(' / ');
  addLine('<span class="fl-icon">🔤</span><span class="fl-content"><span class="fl-opinion" style="color:#a78bfa">社群暗语形成：'+memberNames+'共同经历了「'+event.text+'」，凝练出暗语「'+aliasSample+'」</span></span><span class="fl-time"></span>',true);
}

// 对话文本暗语替换：圈内人对话时，通用词汇替换为事件代号
function applySubcultureToDialogue(speaker,listener,text){
  if(!speaker.subcultures||!listener.subcultures||!speaker.subcultures.length||!listener.subcultures.length)return text;
  // 寻找两人共有的社群暗语组
  var sharedGroup=null;
  for(var i=0;i<speaker.subcultures.length;i++){
    var g=speaker.subcultures[i];
    if(g.members.includes(listener.id)){
      sharedGroup=g;break;
    }
  }
  if(!sharedGroup||!sharedGroup.aliasMap)return text;
  var result=text;
  var keys=Object.keys(sharedGroup.aliasMap);
  for(var k=0;k<keys.length;k++){
    if(result.indexOf(keys[k])>=0){
      result=result.replace(keys[k],'「'+sharedGroup.aliasMap[keys[k]]+'」');
    }
  }
  return result;
}

// 圈外人旁听检测：观察者不在暗语圈内，听到暗语后产生怀疑
function checkOutsiderEavesdrop(observer,speaker,listener,dialogueText){
  if(!observer||!speaker||!listener)return null;
  if(!speaker.subcultures||!speaker.subcultures.length)return null;
  // 说话者和倾听者是否在同一个暗语圈内
  var hasSharedGroup=false;
  for(var i=0;i<speaker.subcultures.length;i++){
    if(speaker.subcultures[i].members.includes(listener.id)){
      hasSharedGroup=true;break;
    }
  }
  if(!hasSharedGroup)return null;
  // 观察者是否在那个圈内
  var observerInGroup=false;
  for(var j=0;j<speaker.subcultures.length;j++){
    if(speaker.subcultures[j].members.includes(observer.id)){
      observerInGroup=true;break;
    }
  }
  // 圈内人在用暗语，观察者不在圈内 → 产生怀疑
  if(!observerInGroup&&dialogueText.indexOf('「')>=0){
    if(REL[observer.id]&&REL[observer.id][speaker.id]){
      REL[observer.id][speaker.id].t=Math.max(0,REL[observer.id][speaker.id].t-3);
    }
    return observer.name+'看到'+speaker.name+'和'+listener.name+'用奇怪的暗语说话，怀疑他们在密谋';
  }
  return null;
}

// ═══════════════ 模块二：经济生态与职业生存依赖链 ═══════════════
// 资源维度：食物(food)、工具(tools)、钱币(coin)、铁矿(iron)
// 职业生产循环每20 Tick结算一次，稀缺驱动债务与社交博弈
function processEconomicCycle(npc){
  npc.inventory=npc.inventory||{food:3,tools:2,coin:15,iron:1};
  var inv=npc.inventory;
  // 每5 tick进行一次生产结算（约30-40秒可见一次经济循环）
  if(engineTick%5!==0)return;
  // 基础消耗：每人每周期消耗1食物
  inv.food=Math.max(0,inv.food-1);
  if(inv.food<1){
    npc.hunger=clamp(npc.hunger+10,0,100);
    npc.happiness=clamp(npc.happiness-3,0,100);
    // 食物耗尽 → 触发资源危机，寻求帮助
    if(inv.food<=0&&inv.coin<=0){
      createResourceDebtMotive(npc,'food');
    }
  }
  // 职业生产
  if(npc.roleEco==='铁匠'){
    // 阿福：消耗食物+铁矿 → 产出工具
    if(inv.food>=2&&inv.iron>=1){
      inv.food-=2;inv.iron-=1;inv.tools+=2;
      if(Math.random()<.4)addLine('<span class="fl-icon">🔨</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+npc.name+' 打制了2件工具（库存：食物'+inv.food+' 铁矿'+inv.iron+' 工具'+inv.tools+'）</span></span><span class="fl-time"></span>',true);
    }else if(inv.food<2){
      createResourceDebtMotive(npc,'food');
    }else if(inv.iron<1){
      // 铁矿不足，需要从小翠(采集者)获取
      createResourceDebtMotive(npc,'iron');
    }
  }else if(npc.roleEco==='采集者'){
    // 小翠：消耗工具 → 产出食物+铁矿
    if(inv.tools>0){
      inv.tools-=1;inv.food+=6;
      var gotIron=Math.random()<.4;if(gotIron)inv.iron+=1;
      if(Math.random()<.4)addLine('<span class="fl-icon">🌿</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+npc.name+' 采集了6份食物'+(gotIron?'，还找到了1块铁矿':'')+'（库存：食物'+inv.food+' 工具'+inv.tools+'）</span></span><span class="fl-time"></span>',true);
    }else{
      createResourceDebtMotive(npc,'tools');
    }
  }else if(npc.roleEco==='护卫'){
    // 云溪：消耗食物+工具 → 提供安全保护（全村受益）
    if(inv.food>=2&&inv.tools>0){
      inv.food-=2;inv.tools-=1;
      // 护卫产出安全感，降低全村恐惧
      NPCS.forEach(function(other){
        if(other.id!==npc.id)other.emotionalState.fear=clamp(other.emotionalState.fear-1,0,100);
      });
      if(Math.random()<.35)addLine('<span class="fl-icon">⚔</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+npc.name+' 巡逻守卫，全村安全感+1</span></span><span class="fl-time"></span>',true);
    }
  }else if(npc.roleEco==='管理者'){
    // 老村长：消耗食物 → 调解债务、分配资源
    if(inv.food>=1){
      inv.food-=1;
      // 管理者调解关系：随机提升两个村民间的信任
      if(Math.random()<.3){
        var ids=NPCS.map(function(n){return n.id;}).filter(function(id){return id!==npc.id;});
        var a=ids[Math.floor(Math.random()*ids.length)];
        var b=ids[Math.floor(Math.random()*ids.length)];
        if(a!==b&&REL[a]&&REL[a][b]){REL[a][b].t=clamp(REL[a][b].t+2,0,100);}
      }
      if(Math.random()<.35)addLine('<span class="fl-icon">🏛</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+npc.name+' 调解村务，维护村庄秩序</span></span><span class="fl-time"></span>',true);
    }
  }else if(npc.roleEco==='记录者'){
    // 书生：消耗食物 → 产出知识（影响信念传播效率）
    if(inv.food>=1){
      inv.food-=1;
      npc.inventory.coin+=5; // 记录/教书换取钱币
      if(Math.random()<.35)addLine('<span class="fl-icon">📜</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+npc.name+' 教书记录，换取了5枚钱币（余额：'+npc.inventory.coin+'）</span></span><span class="fl-time"></span>',true);
    }
  }
  // 工具折旧：所有NPC每周期工具自然损耗1
  if(inv.tools>0&&Math.random()<.3)inv.tools=Math.max(0,inv.tools-1);
}

// 资源债务驱动社交决策
function createResourceDebtMotive(debtor,neededResource){
  // 寻找能提供该资源的人
  var providers=NPCS.filter(function(n){
    if(!n||n.id===debtor.id)return false;
    if(neededResource==='food'&&n.inventory.food>=3)return true;
    if(neededResource==='tools'&&n.roleEco==='铁匠'&&n.inventory.tools>=1)return true;
    if(neededResource==='iron'&&n.roleEco==='采集者')return true;
    return false;
  });
  if(providers.length===0){
    // 无人可借 → 绝望
    debtor.anger=clamp(debtor.anger+8,0,100);
    debtor.happiness=clamp(debtor.happiness-5,0,100);
    return;
  }
  // 优先找信任度最高的提供者
  providers.sort(function(a,b){
    var ta=REL[debtor.id]&&REL[debtor.id][a.id]?REL[debtor.id][a.id].t:50;
    var tb=REL[debtor.id]&&REL[debtor.id][b.id]?REL[debtor.id][b.id].t:50;
    return tb-ta;
  });
  var bestProvider=providers[0];
  var trust=REL[debtor.id]&&REL[debtor.id][bestProvider.id]?REL[debtor.id][bestProvider.id].t:50;
  if(trust>40){
    // 赊账成功：债务记录到REL中
    if(!REL[debtor.id][bestProvider.id])REL[debtor.id][bestProvider.id]={t:50,r:''};
    REL[debtor.id][bestProvider.id].debt=(REL[debtor.id][bestProvider.id].debt||0)+1;
    // 债务方获得资源，债主资源减少
    if(neededResource==='food'){debtor.inventory.food+=2;bestProvider.inventory.food-=2;}
    if(neededResource==='tools'){debtor.inventory.tools+=1;bestProvider.inventory.tools-=1;}
    if(neededResource==='iron'){debtor.inventory.iron+=1;bestProvider.inventory.iron-=1;}
    debtor.happiness=clamp(debtor.happiness+2,0,100);
    addLine('<span class="fl-icon">🤝</span><span class="fl-content"><span class="fl-opinion" style="color:#f0b958">'+debtor.name+'向'+bestProvider.name+'赊账借了'+neededResource+'（债务+'+(REL[debtor.id][bestProvider.id].debt||1)+'）</span></span><span class="fl-time"></span>',true);
  }else{
    // 信任不够不敢借
    debtor.anger=clamp(debtor.anger+5,0,100);
    addLine('<span class="fl-icon">😰</span><span class="fl-content"><span class="fl-opinion" style="color:#f87171">'+debtor.name+'缺'+neededResource+'但不敢向'+bestProvider.name+'开口（信任度不足）</span></span><span class="fl-time"></span>',true);
  }
}

// 债务对社交话语权的影响：欠债者在债主面前弱化冲撞，强化服从
function getDebtSocialModifier(speakerId,listenerId){
  if(!REL[speakerId]||!REL[speakerId][listenerId])return{confrontPenalty:0,acceptBonus:0};
  var debtOwed=REL[speakerId][listenerId].debt||0;
  if(debtOwed>0){
    return {
      confrontPenalty:-25*debtOwed, // 欠债越多越不敢冲撞
      acceptBonus:+15*debtOwed      // 欠债越多越愿意服从
    };
  }
  // 反过来：如果对方欠我的债，我可以对他不客气
  var debtTheyOwe=REL[listenerId]&&REL[listenerId][speakerId]?REL[listenerId][speakerId].debt||0:0;
  if(debtTheyOwe>0){
    return {
      confrontPenalty:0,
      acceptBonus:-10*debtTheyOwe // 欠我债的人还敢提要求？不太愿意接受
    };
  }
  return {confrontPenalty:0,acceptBonus:0};
}

// ═══════════════ 优化6：情绪时间衰减 ═══════════════
// 不同情绪有不同的衰减速度，符合人类心理
// 恐惧快速衰减（肾上腺素消退），内疚缓慢衰减（心理负担持续）
var EMOTION_DECAY={
  fear:2.5,      // 恐惧快速消退（肾上腺素半衰期短）
  urgency:3.0,   // 紧迫感更快消退
  relief:1.0,    // 释然感缓慢消退
  aftermath:0.5  // 事后影响最持久
};
function decayEmotions(npc){
  var es=npc.emotionalState;
  for(var k in EMOTION_DECAY){
    if(es[k]!==undefined&&es[k]>0){
      es[k]=clamp(es[k]-EMOTION_DECAY[k],0,100);
    }
  }
  // 情绪影响心情：恐惧转愤怒，紧迫转焦虑
  if(es.fear>40)npc.happiness=clamp(npc.happiness-1,0,100);
  if(es.urgency>30)npc.anger=clamp(npc.anger+.3,0,100);
  if(es.aftermath>20)npc.happiness=clamp(npc.happiness-.8,0,100);
  if(es.relief>50)npc.happiness=clamp(npc.happiness+1,0,100);
}

// ═══════════════ 内稳态系统 ═══════════════
// ═══════════════ 防御性初始化：确保NPC缺失字段被补齐 ═══════════════
function ensureNPCFields(npc){
  if(!npc.beliefs)npc.beliefs={};
  if(!npc.emotionalState)npc.emotionalState={fear:0,urgency:0,relief:0,aftermath:0};
  if(!npc.dissonance)npc.dissonance=[];
  if(!npc.reflections)npc.reflections=[];
  if(!npc.commitments)npc.commitments=[];
  if(!npc.subcultures)npc.subcultures=[];
  if(!npc.position)npc.position={x:0,y:0};
  if(!npc.inventory)npc.inventory={food:3,tools:2,coin:15,iron:1};
  if(npc.attentionLocked===undefined)npc.attentionLocked=false;
  if(npc.attentionTarget===undefined)npc.attentionTarget=null;
  if(npc.attentionUntil===undefined)npc.attentionUntil=0;
  if(npc.frustration===undefined)npc.frustration=0;
  if(npc.stressTicks===undefined)npc.stressTicks=0;
  if(npc.exhaustion===undefined)npc.exhaustion=0;
  if(npc.roleEco===undefined)npc.roleEco=null;
}

function updateHomeostasis(npc){
  // ═══════════ v5.0 模块二：经济生态结算 — 职业资源生产与消耗 ═══════════
  processEconomicCycle(npc);
  // 饥饿随时间缓慢增长
  npc.hunger=clamp(npc.hunger+.5+Math.random()*1.5,0,100);
  // 能量自然恢复，社交疲劳自然衰减
  npc.energy=clamp(npc.energy+1.5,0,100);
  npc.socialFatigue=clamp(npc.socialFatigue-1.5,0,100);
  // 饥饿影响能量恢复
  if(npc.hunger>70)npc.energy=clamp(npc.energy-.8,0,100);
  if(npc.hunger>90)npc.energy=clamp(npc.energy-2,0,100);
  // 情绪传染：关系亲近的NPC情绪互相影响
  NPCS.forEach(function(other){
    if(other.id===npc.id)return;
    var trust=REL[npc.id]&&REL[npc.id][other.id]?REL[npc.id][other.id].t:50;
    if(trust>55){
      if(other.anger>60)npc.anger=clamp(npc.anger+.8,0,100);
      if(other.happiness>65)npc.happiness=clamp(npc.happiness+.6,0,100);
      if(other.happiness<25)npc.happiness=clamp(npc.happiness-.4,0,100);
    }
  });
  // 情绪自然衰减
  npc.anger=clamp(npc.anger-.3,0,100);
  npc.happiness=clamp(npc.happiness+(npc.happiness<50?.2:-.1),0,100);
  // 记忆驱动的情绪波动：偶尔回忆影响心情
  if(npc.memories.length>0&&Math.random()<.08){
    var mem=npc.memories[Math.floor(Math.random()*Math.min(npc.memories.length,5))];
    if(mem.em<0)npc.happiness=clamp(npc.happiness-2,0,100);
    if(mem.em>0)npc.happiness=clamp(npc.happiness+1.5,0,100);
  }
  // 天气影响内稳态：环境氛围影响NPC情绪和生理
  if(weather==='rain'){
    npc.happiness=clamp(npc.happiness-1.5,0,100); // 雨天心情低落
    npc.energy=clamp(npc.energy-.3,0,100); // 阴雨天气乏力
    if(npc.personality.沉默>50)npc.anger=clamp(npc.anger-.5,0,100); // 沉默型在雨天更平静
  }
  if(weather==='fog'){
    npc.happiness=clamp(npc.happiness-1,0,100); // 雾天压抑
    npc.personality.好奇>50?npc.energy=clamp(npc.energy+.5,0,100):null; // 好奇型在雾天兴奋
    npc.anger=clamp(npc.anger-.3,0,100); // 雾天整体趋于安静
  }
  if(weather==='wind'){
    npc.anger=clamp(npc.anger+1.2,0,100); // 大风天烦躁
    npc.energy=clamp(npc.energy-.5,0,100); // 大风消耗体力
    if(npc.personality.暴躁>60)npc.anger=clamp(npc.anger+1.5,0,100); // 暴躁型在大风天更烦躁
  }
  // ═══════════ 维度四：认知失调情绪衰减 ═══════════
  // 内疚标记持续影响心情，直到补偿行为完成
  if(npc.dissonance&&npc.dissonance.length>0){
    npc.dissonance.forEach(function(d){
      if(engineTick-d.tick<=3){
        // 内疚持续压低幸福感
        if(d.type==='guilt')npc.happiness=clamp(npc.happiness-1.5,0,100);
        if(d.type==='shame')npc.anger=clamp(npc.anger+.5,0,100); // 羞耻转为愤怒
      }
    });
    // 清理过期失调（超过5 tick）
    npc.dissonance=npc.dissonance.filter(function(d){return engineTick-d.tick<=5;});
  }
  // ═══════════ 维度二：信念衰变 ═══════════
  decayBeliefs(npc);
  // ═══════════ 优化6：情绪时间衰减 ═══════════
  decayEmotions(npc);
  // ═══════════ 优化3：持续应激计数 — 注意力锁定期间累积 ═══════════
  if(npc.attentionLocked){
    if(npc.stressTicks===undefined)npc.stressTicks=0;
    npc.stressTicks++;
  }
  // ═══════════ 优化1：挫败感自然衰减 — 时间冲淡烦躁 ═══════════
  if(npc.frustration&&npc.frustration>0&&!npc.attentionLocked){
    npc.frustration=clamp(npc.frustration-1.5,0,100);
  }
  // ═══════════ 优化2：注意力释放检查 ═══════════
  releaseAttention(npc);
  // ═══════════ v5.1 应激衰减：非锁定状态下，残余应激随时间消退 ═══════════
  if(!npc.attentionLocked&&npc.stressTicks>0){
    npc.stressTicks=Math.max(0,npc.stressTicks-1);
  }
  // ═══════════ v5.1 疲劳恢复：非锁定状态下，残余疲劳自然衰减 ═══════════
  // 休息时衰减更快，饥饿时衰减更慢
  if(!npc.attentionLocked&&npc.exhaustion>0){
    var decayRate=1.2; // 基础衰减
    if(npc.energy<30)decayRate=.4; // 低能量时恢复慢
    if(npc.hunger>70)decayRate-=.5; // 饥饿时恢复慢
    if(npc.energy>60)decayRate+=.8; // 高能量时恢复快
    npc.exhaustion=clamp(npc.exhaustion-decayRate,0,100);
  }
  // ═══════════ v5.1 自主进食：非危机时饿了自己吃 ═══════════
  if(!npc.attentionLocked&&npc.hunger>60&&npc.inventory.food>0&&Math.random()<.25){
    npc.inventory.food--;
    npc.hunger=clamp(npc.hunger-25,0,100);
    npc.happiness=clamp(npc.happiness+3,0,100);
    npc.energy=clamp(npc.energy+5,0,100);
    if(Math.random()<.5)addLine('<span class="fl-icon">🍽</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+npc.name+' 拿出食物吃了起来（饥饿-25，库存-1）</span></span><span class="fl-time"></span>',true);
  }
  // ═══════════ v5.1 自主休息：低能量或高疲劳时主动休息恢复 ═══════════
  if(!npc.attentionLocked&&(npc.energy<30||npc.exhaustion>50)&&Math.random()<.3){
    var restEnergy=clamp(8+npc.personality.懒惰*.08,0,20);
    npc.energy=clamp(npc.energy+restEnergy,0,100);
    npc.exhaustion=clamp((npc.exhaustion||0)-5,0,100);
    npc.socialFatigue=clamp(npc.socialFatigue-3,0,100);
    npc.happiness=clamp(npc.happiness+2,0,100);
    if(npc.exhaustion>60&&Math.random()<.55)addLine('<span class="fl-icon">😴</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+npc.name+' 累极了，找了个地方坐下歇息（疲劳-5，精力+'+Math.round(restEnergy)+'）</span></span><span class="fl-time"></span>',true);
  }
  // ═══════════ v5.1 自主社交：空闲时找信任的人闲聊 ═══════════
  if(!npc.attentionLocked&&npc.socialFatigue<30&&npc.energy>30&&npc.exhaustion<50&&Math.random()<.08){
    // 找信任度最高的人闲聊
    var bestFriend=null;var bestTrust=0;
    NPCS.forEach(function(other){
      if(other.id===npc.id)return;
      var t=REL[npc.id]&&REL[npc.id][other.id]?REL[npc.id][other.id].t:0;
      if(t>bestTrust){bestTrust=t;bestFriend=other;}
    });
    if(bestFriend&&bestTrust>50){
      npc.happiness=clamp(npc.happiness+2,0,100);
      npc.socialFatigue=clamp(npc.socialFatigue+5,0,100);
      if(Math.random()<.4)addLine('<span class="fl-icon">💬</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+npc.name+' 闲来无事，找'+bestFriend.name+'闲聊了几句</span></span><span class="fl-time"></span>',true);
    }
  }
  // ═══════════ 盲区一：长线承诺推进 ═══════════
  // 每 tick 推进承诺进度，内疚驱动时推进更快，空闲时优先调度
  processCommitments(npc);
}
// 社交交互后触发疲劳累积
function addSocialFatigue(npc,intensity){
  npc.socialFatigue=clamp(npc.socialFatigue+intensity,0,100);
  npc.energy=clamp(npc.energy-intensity*.3,0,100);
  // 社交疲劳过高 → 情绪不稳定，更容易愤怒
  if(npc.socialFatigue>70)npc.anger=clamp(npc.anger+3,0,100);
  if(npc.socialFatigue>85)npc.anger=clamp(npc.anger+5,0,100);
  if(npc.socialFatigue>85)npc.happiness=clamp(npc.happiness-3,0,100);
}

// ═══════════════ 持久化意图与计划栈 ═══════════════
function compilePlan(npc,motive){
  // 根据动机编译多步动作计划
  var plan=[];
  var mt=motive.type||'';
  if(mt==='confrontation'){
    plan.push({aid:'confront',desc:'走到'+motive.target+'面前',delay:0});
    plan.push({aid:'confront',desc:'对质',delay:1});
  }else if(mt==='sadness'){
    plan.push({aid:'hide',desc:'找个角落坐下',delay:0});
    plan.push({aid:'ignore',desc:'发呆',delay:1});
  }else if(mt==='greed_urge'){
    plan.push({aid:'investigate',desc:'四处打量',delay:0});
    plan.push({aid:'exploit',desc:'寻找机会',delay:1});
  }else if(mt==='curiosity'){
    plan.push({aid:'investigate',desc:'凑近观察',delay:0});
    plan.push({aid:'ask',desc:'找人打听',delay:1});
  }else if(mt==='daily'){
    // ═══════════ v5.2 修复：daily动机不再静默ignore，而是从动机文本提取可见行为 ═══════════
    var text=motive.text||'';
    if(text.indexOf('聊天')>=0||text.indexOf('串门')>=0)plan.push({aid:'ask',desc:'找人闲聊',delay:0});
    else if(text.indexOf('忙活')>=0||text.indexOf('收拾')>=0)plan.push({aid:'help',desc:'忙活手头的事',delay:0});
    else if(text.indexOf('歇着')>=0||text.indexOf('乘凉')>=0||text.indexOf('坐下来')>=0)plan.push({aid:'ignore',desc:'找个地方歇着',delay:0});
    else if(text.indexOf('散步')>=0||text.indexOf('转悠')>=0||text.indexOf('透透气')>=0)plan.push({aid:'investigate',desc:'四处走走',delay:0});
    else if(text.indexOf('找')>=0||text.indexOf('打量')>=0)plan.push({aid:'investigate',desc:'四下张望',delay:0});
    else if(text.indexOf('饿')>=0||text.indexOf('吃')>=0)plan.push({aid:'investigate',desc:'找吃的',delay:0});
    else if(text.indexOf('发呆')>=0||text.indexOf('一言不发')>=0||text.indexOf('盯着')>=0)plan.push({aid:'ignore',desc:'静静地待着',delay:0});
    else if(text.indexOf('不耐烦')>=0||text.indexOf('走来走去')>=0)plan.push({aid:'confront',desc:'不耐烦地来回踱步',delay:0});
    else plan.push({aid:'ignore',desc:text.replace(npc.name,'')||'做自己的事',delay:0});
  }else if(mt==='social'){
    plan.push({aid:'ask',desc:'找人聊聊',delay:0});
    plan.push({aid:'gossip',desc:'继续闲聊',delay:1});
  }else{
    plan.push({aid:'ignore',desc:'日常行动',delay:0});
  }
  return plan;
}
function checkInterrupts(npc){
  // 高优先级中断：生命威胁、极端情绪
  if(npc.anger>85&&npc.planQueue.length>0){
    // 愤怒溢出 — 放弃当前计划，找人发泄
    var target=null,minT=100;
    if(REL[npc.id])for(var tid in REL[npc.id]){if(REL[npc.id][tid].t<minT){minT=REL[npc.id][tid].t;target=tid;}}
    if(target&&minT<50){
      npc.planQueue=[{aid:'confront',desc:'怒气冲冲去找'+getNPC(target).name,delay:0}];
      npc.activeGoal={type:'confrontation',target:target,text:npc.name+'被愤怒冲昏了头脑'};
      return true;
    }
  }
  if(npc.socialFatigue>85&&npc.planQueue.length>0){
    // 社交透支 — 放弃计划，回屋休整
    npc.planQueue=[{aid:'hide',desc:'疲惫不堪，回屋休整',delay:0}];
    npc.activeGoal={type:'daily',text:npc.name+'社交透支，需要独处'};
    return true;
  }
  if(npc.hunger>80&&npc.planQueue.length>0&&npc.planQueue[0].aid!=='ignore'){
    // 极度饥饿 — 优先找食物
    npc.planQueue=[{aid:'investigate',desc:'肚子饿了，找吃的',delay:0}];
    npc.activeGoal={type:'daily',text:npc.name+'饿得不行了'};
    return true;
  }
  return false;
}

// ═══════════════ 维度一：System 1 直觉反射层（关系驱动版） ═══════════════
// 人类决策的本质：不是"我有多勇敢"，而是"危险中有没有我关心的人"
// 一个胆小的人看到自己孩子在火场里，会毫不犹豫冲进去
// 一个勇敢的人看到无关的火场，可能只是远远观望
function reflexCheck(npc,event){
  var p=npc.personality;
  // ═══════════ 优化3：自我损耗 — 持续应激下有效勇敢值衰减 ═══════════
  var effective=getEffectiveTraits(npc);
  var effBrave=effective.勇敢;
  // 1. 计算危险感知指数
  var dangerIndex=(event.severity||0)*.7;
  if(event.type==='env_inject'||event.type==='danger')dangerIndex+=20;
  if(event.type==='confrontation')dangerIndex+=12;
  dangerIndex-=(p.勇敢-50)*.15;
  dangerIndex+=(p.沉默-50)*.08;
  if(npc.role==='少女')dangerIndex+=8;
  if(npc.role==='书生')dangerIndex+=5;
  if(npc.memories){npc.memories.forEach(function(m){if(m.imp>70&&(m.tag==='事件'||m.tag==='danger'))dangerIndex+=3;});}
  // ═══════════ 盲区二：群聚心理修正危险感知 ═══════════
  if(event.perceivers&&event.perceivers.length>1){
    var crowd=getCrowdEffect(npc,event,event.perceivers);
    dangerIndex+=crowd.panicContagion*.6; // 恐慌传染提高危险感知
    dangerIndex-=crowd.leaderBoost*.3; // 带头人效应降低危险感知
  }
  dangerIndex=clamp(dangerIndex,0,100);
  // 2. 关系覆盖检查：危险中有没有我关心的人？
  // 这是人之为人的关键——情感牵绊可以覆盖性格驱动的决策
  var relationshipOverride=null;
  if(event.target){
    var trust=REL[npc.id]&&REL[npc.id][event.target]?REL[npc.id][event.target].t:0;
    var relType=REL[npc.id]&&REL[npc.id][event.target]?REL[npc.id][event.target].r:'';
    // 至亲至爱（信任>70）：无论多危险，优先保护
    if(trust>70&&dangerIndex>50){
      relationshipOverride={forced:'help',reason:'情感牵绊：'+getNPC(event.target).name+'有危险，本能驱使去保护'};
    }
    // 恩人/敬重的人（信任>50且有恩/敬关系）：强烈倾向帮助
    else if(trust>50&&(relType==='恩'||relType==='敬'||relType==='信')&&dangerIndex>60){
      relationshipOverride={forced:'help',reason:'报恩之心：'+getNPC(event.target).name+'对我有恩，不能袖手旁观'};
    }
    // 恐惧的人遇到危险（信任<20）：内心挣扎——想躲但良心不安
    else if(trust<20&&dangerIndex>60&&p.善良>50){
      // 善良的人在仇人遇险时也会犹豫——最终可能还是帮
      if(Math.random()<.4){
        relationshipOverride={forced:'help',reason:'良心挣扎：虽然讨厌'+getNPC(event.target).name+'，但见死不救做不到'};
      }
    }
  }
  // 3. 身份责任覆盖：某些角色有不可推卸的责任
  var dutyOverride=null;
  if(!relationshipOverride&&dangerIndex>55){
    if(npc.role==='侠客'&&p.正义>60){
      dutyOverride={forced:'investigate',reason:'侠义本分：危险当前，义不容辞'};
    }else if(npc.role==='村长'){
      dutyOverride={forced:'report',reason:'村长职责：必须组织村民应对危险'};
    }else if(npc.role==='郎中'){
      dutyOverride={forced:'help',reason:'医者仁心：有人可能受伤，必须去帮忙'};
    }
  }
  // 4. 优先级：关系覆盖 > 身份责任 > 性格反射
  if(relationshipOverride){
    // 锁定注意力：关心的人处于危险中，注意力完全锁定
    lockAttention(npc,event,15); // 15 tick 内注意力锁定
    return relationshipOverride;
  }
  if(dutyOverride){
    lockAttention(npc,event,10);
    return dutyOverride;
  }
  // 5. 未触发任何覆盖 → 标准性格反射（使用有效勇敢值，考虑自我损耗）
  if(dangerIndex<70)return null;
  lockAttention(npc,event,8);
  if(dangerIndex>85){
    if(effBrave>80&&p.正义>60)return{forced:'investigate',reason:'直觉反射：危险极高，但勇气迫使上前探查'};
    if(effBrave>60&&p.正义>40)return{forced:'report',reason:'直觉反射：危险极高，本能寻求帮助'};
    return{forced:'hide',reason:'直觉反射：生存本能压倒一切，立即躲避'};
  }
  if(effBrave>70&&p.正义>50)return{forced:'investigate',reason:'直觉反射：危险当前，义不容辞'};
  if(effBrave>50&&p.正义>30)return{forced:'report',reason:'直觉反射：危险，需要报告'};
  if(effBrave<30)return{forced:'hide',reason:'直觉反射：恐惧压倒一切，本能躲避'};
  if(p.善良>70)return{forced:'help',reason:'直觉反射：危险当前，善念驱使出手'};
  return{forced:'hide',reason:'直觉反射：危险感知触发躲避本能'};
}

// ═══════════ 注意力锁定机制 ═══════════
// 当高严重度事件发生时，NPC的注意力被锁定，无法处理其他事件
// 这解释了为什么着火时没人去八卦——不是评分低，而是注意力根本不在那
function lockAttention(npc,event,duration){
  // ═══════════ 优化1：目标中断挫败感 — 打断正在执行的承诺 ═══════════
  applyGoalDisruptionFriction(npc);
  npc.attentionLocked=true;
  npc.attentionTarget=event.text||'';
  npc.attentionUntil=engineTick+duration;
  // 注意力锁定提升情绪唤醒
  npc.emotionalState.fear=clamp(npc.emotionalState.fear+(event.severity||0)*.5,0,100);
  npc.emotionalState.urgency=clamp(npc.emotionalState.urgency+(event.severity||0)*.3,0,100);
}
function releaseAttention(npc){
  if(npc.attentionLocked&&engineTick>=npc.attentionUntil){
    // ═══════════ 优化3：应激释放 — 记录应激Tick数，用于事后反思 ═══════════
    if(npc.stressTicks>3){
      // 高强度应激后产生残余疲劳：越是勇敢的人越硬撑，撑完后越瘫
      var exhaustionGain=Math.min(100,npc.stressTicks*8+npc.personality.勇敢*.2);
      npc.exhaustion=(npc.exhaustion||0)+exhaustionGain;
      npc.exhaustion=clamp(npc.exhaustion,0,100);
      addLine('<span class="fl-icon">😮‍💨</span><span class="fl-content"><span class="fl-opinion" style="color:#c084fc">'+npc.name+' 持续应激'+npc.stressTicks+' Tick后终于放松，意志力消耗殆尽，残余疲劳+'+Math.round(exhaustionGain)+'</span></span><span class="fl-time"></span>',true);
    }
    npc.stressTicks=0;
    npc.attentionLocked=false;
    npc.attentionTarget=null;
    // 注意力释放后进入"事后反思"阶段
    if(npc.emotionalState.fear>30||npc.emotionalState.urgency>30){
      triggerAftermathReflection(npc);
    }
  }
}
function isDistracted(npc){
  return npc.attentionLocked&&engineTick<npc.attentionUntil;
}

function scoreAction(npc,aid,event,spectators){
  var a=ACTIONS[aid];if(!a)return 0;
  var p=npc.personality,score=0;
  for(var k in a.traits){if(p[k]!==undefined)score+=p[k]*a.traits[k]*.01;}
  if(npc.anger>50&&a.aggression>.3)score+=15;
  if(npc.happiness<30&&a.aggression<.2)score+=10;
  // 记忆反馈偏差 — NPC记得历史交互，影响当前决策
  if(event.target)score+=getMemoryBias(npc,event.target,aid);
  // 语义标签偏差 — 事件标签与性格契合度
  var tags=getEventTags(event);
  score+=getTagBias(npc,tags,aid);
  // 内稳态修正 — 社交疲劳/饥饿影响行为倾向
  if(npc.socialFatigue>70)score+=npc.socialFatigue*.05*(a.aggression||0);
  if(npc.hunger>80)score+=npc.hunger*.03*(a.aggression||0);
  // 身份驱动行为修正 — 不同身份对同一事件的反应倾向不同
  var roleBias={
    侠客:{investigate:8,confront:6,help:5,mediate:3,ignore:-4,hide:-6,gossip:-5},
    村民:{gossip:5,ignore:4,ask:3,confront:-3,investigate:-3,exploit:2},
    少女:{hide:5,ask:4,ignore:3,confront:-6,exploit:-4,investigate:0},
    村长:{mediate:8,ask:5,investigate:4,confront:2,gossip:-3,hide:-4},
    书生:{investigate:6,ask:5,report:4,confront:-4,gossip:-2,help:2},
    郎中:{help:6,ask:5,investigate:4,confront:-3,ignore:-2},
    厨子:{help:4,share:5,ask:3,confront:-3,investigate:-2},
    渔夫:{ignore:4,ask:3,report:3,confront:-2,investigate:-2},
    樵夫:{ignore:3,help:3,ask:2,confront:-2,gossip:-2},
    商贩:{exploit:5,gossip:4,ask:3,help:0,confront:-3},
    酒鬼:{ignore:5,confront:4,gossip:3,help:-2,mediate:-3,investigate:-3},
    乞丐:{ask:5,ignore:4,exploit:3,confront:-2,help:-2,mediate:-3},
    更夫:{report:6,investigate:4,ask:3,ignore:-2},
    货郎:{gossip:5,ask:4,exploit:3,confront:-3,help:0},
    屠户:{confront:4,ignore:3,help:1,mediate:-2,gossip:-3},
    绣娘:{ask:4,ignore:3,help:3,confront:-5,investigate:-2},
    画师:{investigate:5,ask:3,ignore:2,confront:-4},
    琴师:{ask:4,ignore:3,mediate:3,confront:-4,investigate:-2},
    说书:{gossip:6,report:5,ask:3,confront:-3,ignore:-2},
    道士:{investigate:5,mediate:4,ask:3,confront:0,ignore:-2,gossip:-4}
  };
  var rb=roleBias[npc.role];if(rb&&rb[aid]!==undefined)score+=rb[aid];
  // 恩怨偏置：记仇/报恩影响行为
  if(event.target)score+=getGrudgeBias(npc,event.target);
  // 名声偏置：八卦影响信任
  if(event.target)score+=applyReputationBias(npc.id,event.target)*.5;
  // 习惯加成：习惯动作更容易被选择
  score+=getHabitBonus(npc,aid);
  // ═══════════ 维度四：认知失调补偿 — 内疚/羞耻驱动补偿行为 ═══════════
  if(event.target)score+=getDissonanceBias(npc,event.target,aid);
  // ═══════════ 优化5：事后反思偏置 — 后悔/骄傲影响后续行为 ═══════════
  score+=getReflectionBias(npc,aid);
  // ═══════════ 盲区二：群聚旁观者效应 — 人多且没人带头时出手意愿下降 ═══════════
  if(spectators&&spectators.length>1){
    var crowd=getCrowdEffect(npc,event,spectators);
    // 旁观者效应：个人责任感被稀释
    if(aid==='help'||aid==='investigate'||aid==='report'){
      score+=crowd.inhibition; // 负面偏置，人多不出手
      score+=crowd.leaderBoost; // 正面偏置，有人带头就跟随
    }
    if(aid==='hide'&&crowd.panicContagion>10){
      score+=crowd.panicContagion*.4; // 恐慌传染：更多人跑了，我也跑
    }
  }
  // ═══════════ 盲区三：二级心智推测 — "在意的人怎么看我" ═══════════
  if(spectators&&spectators.length>0){
    score+=getMetaReputationCost(npc,aid,spectators);
  }
  // 事件驱动行为偏置：灾难/紧急/危险事件触发本能反应
  if(event.severity>50){
    // 高严重度事件的默认行为倾向
    var severityBias={investigate:8,report:7,help:5,mediate:5,ask:3,hide:4,confront:-2,ignore:-5,gossip:-3,exploit:-2};
    if(severityBias[aid]!==undefined)score+=severityBias[aid]*(event.severity/60);
    // 危险/灾难概念额外加权
    if(event.type==='env_inject'||event.type==='danger'){
      if(aid==='investigate')score+=6;
      if(aid==='report')score+=5;
      if(aid==='help')score+=4;
      if(aid==='hide')score+=event.severity>70?5:2;
      if(aid==='gossip'||aid==='ignore')score-=3;
    }
  }
  // 紧急事件：低社交动作被抑制，高行动力动作被增强
  if(event.severity>70){
    if(aid==='ignore')score-=8;
    if(aid==='gossip')score-=5;
    if(aid==='investigate'||aid==='report'||aid==='help')score+=5;
  }
  // ═══════════ 维度三：社交承诺 — 在场监督者约束 ═══════════
  // 人类在决策时受社会角色、舆论压力、道德契约约束
  // 贪婪的人在众目睽睽之下也可能表现得慷慨，因为害怕社会声誉受损
  if(spectators&&spectators.length>0){
    spectators.forEach(function(sid){
      if(sid===npc.id)return;
      var spec=getNPC(sid);if(!spec)return;
      // 权威压制：在场者是高声望NPC（村长/侠客），压制高攻击性行为
      var authorityRoles={村长:1,侠客:1};
      if(authorityRoles[spec.role]&&a.aggression>.3){
        score-=(p.正义+p.沉默)*.12; // 正义感和顺从度越高，越不敢在权威面前放肆
      }
      // 恩人监督：如果NPC欠在场者恩情，压制自私行为
      if(npc.favors&&npc.favors[sid]&&npc.favors[sid].score>0){
        if(aid==='exploit'||aid==='claim'||aid==='deny')score-=npc.favors[sid].score*.3;
        if(aid==='help'||aid==='share')score+=npc.favors[sid].score*.2;
      }
      // 倾慕抑制：如果在场者是自己好感度极高的人
      var trust=REL[npc.id]&&REL[npc.id][sid]?REL[npc.id][sid].t:50;
      if(trust>70){
        if(aid==='hide'&&a.aggression<.2)score-=15; // 不想在对方面前显得懦弱
        if(aid==='help'||aid==='share')score+=8; // 想在对方面前表现好
        if(aid==='gossip'&&p.善良>50)score-=5; // 善良的人在喜欢的人面前不说闲话
      }
      // 恐惧压制：如果在场者是自己害怕的人（信任<20），压制直接对抗
      if(trust<20){
        if(aid==='confront')score-=20;
        if(aid==='deny')score-=10;
        if(aid==='hide')score+=10; // 更倾向于躲
      }
    });
  }
  // ═══════════ v5.0 模块二：债务社交话语权 — 欠债在债主面前不敢冲撞 ═══════════
  if(event.target){
    var debtMod=getDebtSocialModifier(npc.id,event.target);
    if(debtMod.confrontPenalty!==0&&(aid==='confront'||aid==='deny')){
      score+=debtMod.confrontPenalty;
    }
    if(debtMod.acceptBonus!==0&&(aid==='help'||aid==='agree'||aid==='accept'||aid==='share')){
      score+=debtMod.acceptBonus;
    }
  }
  // ═══════════ v5.1 疲劳偏置：意志力耗尽时倾向保命行为 ═══════════
  if(npc.exhaustion>60){
    if(aid==='help'||aid==='investigate'||aid==='report'||aid==='confront')score-=npc.exhaustion*.4;
    if(aid==='ignore'||aid==='hide')score+=npc.exhaustion*.3;
  }
  score+=(Math.random()-.5)*(2+CHAOS/100*16)*2;
  return score;
}
function buildThoughtChain(npc,event){
  // ═══════════ 维度一：System 1 直觉反射优先检查 ═══════════
  // 在进入复杂的性格点积评估之前，先检查是否触发直觉反射
  // 如果触发，直接跳过所有评分，输出强制动作
  var reflex=reflexCheck(npc,event);
  if(reflex){
    var forcedName=ACTIONS[reflex.forced]?ACTIONS[reflex.forced].name:reflex.forced;
    var chosen={id:reflex.forced,name:forcedName,score:999,reflex:true,reflexReason:reflex.reason};
    var eD={anger:event.severity>50?8:3,trust:0,happiness:reflex.forced==='hide'?-5:0};
    if(reflex.forced==='investigate')eD.anger=4;
    var newE={anger:clamp(npc.anger+eD.anger,0,100),trust:clamp(npc.trust+eD.trust,0,100),happiness:clamp(npc.happiness+eD.happiness,0,100)};
    return {chosen:chosen,emoD:{trust:0},newE:newE,reflex:true};
  }
  // ═══════════ System 2：理性决策 ═══════════
  // 直觉层放行后，进入复杂的性格点积评估
  var spectators=event.perceivers||[];
  var acts=event.availableActions||[];
  var scored=acts.map(function(aid){return{id:aid,name:ACTIONS[aid]?ACTIONS[aid].name:aid,score:scoreAction(npc,aid,event,spectators)};});
  scored.sort(function(a,b){return b.score-a.score;});
  var chosen=scored[0];
  var eD={anger:0,trust:0,happiness:0};
  if(event.severity>30)eD.anger+=5;
  if(event.type==='confrontation')eD.anger+=8;
  if(event.type==='help_action')eD.happiness+=5;
  if(chosen&&chosen.id==='help')eD.happiness+=3;
  if(chosen&&chosen.id==='hide')eD.happiness-=2;
  var newE={anger:clamp(npc.anger+eD.anger,0,100),trust:clamp(npc.trust+eD.trust,0,100),happiness:clamp(npc.happiness+eD.happiness,0,100)};
  var emoD={trust:0};
  if(event.target&&chosen){if(chosen.id==='confront'||chosen.id==='deny')emoD.trust=-5;if(chosen.id==='help'||chosen.id==='sympathize')emoD.trust=+5;if(chosen.id==='gossip')emoD.trust=-3;}
  return {chosen:chosen,emoD:emoD,newE:newE};
}
function getEventContext(event,understanding){
  // 从事件文本和理解中提取简短上下文，注入到动作/对话文本中
  if(!event)return '';
  var txt=event.text||'';
  // 灾难类上下文
  if(txt.indexOf('火')>=0||txt.indexOf('烧')>=0)return ['远山的大火','那片火光','火光冲天','远处冒着浓烟'][Math.floor(Math.random()*4)];
  if(txt.indexOf('灾')>=0)return ['这场灾难','突如其来的变故','天灾降临'][Math.floor(Math.random()*3)];
  if(txt.indexOf('震')>=0)return ['地动山摇','地震了'][Math.floor(Math.random()*2)];
  if(txt.indexOf('水')>=0&&txt.indexOf('洪')>=0)return ['洪水来了','水位暴涨'][Math.floor(Math.random()*2)];
  if(txt.indexOf('病')>=0||txt.indexOf('疫')>=0)return ['瘟疫蔓延','村里有人病了'][Math.floor(Math.random()*2)];
  if(txt.indexOf('死')>=0||txt.indexOf('亡')>=0)return ['出了人命','有人死了'][Math.floor(Math.random()*2)];
  if(txt.indexOf('血')>=0)return ['有人受伤流血','血迹斑斑'][Math.floor(Math.random()*2)];
  if(txt.indexOf('偷')>=0||txt.indexOf('贼')>=0||txt.indexOf('盗')>=0)return ['有贼人出没','东西被偷了'][Math.floor(Math.random()*2)];
  if(txt.indexOf('打')>=0||txt.indexOf('斗')>=0)return ['有人打架','起了冲突'][Math.floor(Math.random()*2)];
  if(txt.indexOf('狼')>=0||txt.indexOf('兽')>=0)return ['有野兽出没','野兽来了'][Math.floor(Math.random()*2)];
  if(txt.indexOf('鬼')>=0||txt.indexOf('怪')>=0)return ['闹鬼了','有妖怪'][Math.floor(Math.random()*2)];
  // 根据理解中的主导情绪推断

// 判断NPC是否应该心口不一
function shouldDiverge(npc,event,understanding){
  var p=npc.personality;var reasons=[];
  // 善意的谎言：善良>70 + 对方情绪低落/受伤
  if(p.善良>70&&event.target){
    var target=getNPC(event.target);
    if(target&&(target.mood==='sad'||target.happiness<35)){
      reasons.push({type:'whiteLie',weight:3.5});
    }
  }
  if(p.善良>65&&understanding&&understanding.concepts){
    if(understanding.concepts.indexOf('痛苦')>=0||understanding.concepts.indexOf('悲伤')>=0){
      reasons.push({type:'whiteLie',weight:2.5});
    }
  }
  // 心口不一：贪婪>55
  if(p.贪婪>55){reasons.push({type:'greedyMask',weight:2.5});}
  // 隐藏恐惧：勇敢>60 + 理解到危险/威胁
  if(p.勇敢>60&&understanding&&understanding.concepts){
    if(understanding.concepts.indexOf('危险')>=0||understanding.concepts.indexOf('威胁')>=0||understanding.concepts.indexOf('恐惧')>=0){
      reasons.push({type:'hiddenFear',weight:3});
    }
  }
  // 沉默风暴：沉默>55
  if(p.沉默>55){reasons.push({type:'silentStorm',weight:2.5});}
  // 社交伪装：社交>65 + 冲突场景
  if(p.社交>65&&understanding&&understanding.concepts){
    if(understanding.concepts.indexOf('冲突')>=0||understanding.concepts.indexOf('不和')>=0){
      reasons.push({type:'socialMask',weight:2.5});
    }
  }
  // 社交伪装：高社交在公开场合
  if(p.社交>70&&event.perceivers&&event.perceivers.length>3){
    reasons.push({type:'socialMask',weight:2});
  }
  if(reasons.length===0)return null;
  reasons.sort(function(a,b){return b.weight-a.weight;});
  var probability=.25+(reasons[0].weight*.1);
  if(Math.random()<probability)return reasons[0].type;
  return null;
}

// 生成内心真实想法
function genInnerThought(npc,divergenceType,understanding){
  var style=npc.speechStyle||'normal';
  var pool=INNER_THOUGHTS[divergenceType];
  if(!pool)return null;
  var thoughts=pool[style]||pool.normal||[];
  if(thoughts.length===0)return null;
  var thought=thoughts[Math.floor(Math.random()*thoughts.length)];
  // 如果有语义理解，偶尔把理解的内容融入内心独白
  if(understanding&&understanding.concepts&&Math.random()<.4){
    var conceptThoughts={
      '危险':'（心里清楚：这事有危险）',
      '伤害':'（心里知道：有人受伤了）',
      '不公':'（心里明白：这不公平）',
      '财富':'（心里盘算：这跟钱有关）'
    };
    var c=understanding.concepts[0];
    if(conceptThoughts[c])thought=thought+' '+conceptThoughts[c];
  }
  return thought;
}

// NPC记住谁帮过自己/得罪过自己，长期影响行为
function recordGrudge(npc,targetId,action,trustChange){
  if(!targetId||targetId===npc.id)return;
  if(!npc.grudges)npc.grudges={};
  if(!npc.favors)npc.favors={};
  if(trustChange<-3){
    if(!npc.grudges[targetId])npc.grudges[targetId]={score:0,reasons:[],lastTick:engineTick};
    npc.grudges[targetId].score+=Math.abs(trustChange);
    npc.grudges[targetId].reasons.push(action);
    if(npc.grudges[targetId].reasons.length>5)npc.grudges[targetId].reasons.shift();
    npc.grudges[targetId].lastTick=engineTick;
  }
  if(trustChange>3){
    if(!npc.favors[targetId])npc.favors[targetId]={score:0,reasons:[],lastTick:engineTick};
    npc.favors[targetId].score+=trustChange;
    npc.favors[targetId].reasons.push(action);
    if(npc.favors[targetId].reasons.length>5)npc.favors[targetId].reasons.shift();
    npc.favors[targetId].lastTick=engineTick;
  }
  for(var gid in npc.grudges){
    var g=npc.grudges[gid];if(engineTick-g.lastTick>20)g.score=Math.max(0,g.score*.8);
    if(g.score<1)delete npc.grudges[gid];
  }
  for(var fid in npc.favors){
    var f=npc.favors[fid];if(engineTick-f.lastTick>20)f.score=Math.max(0,f.score*.8);

function getEpisodicRef(npc,understanding){
  if(!npc.memories||npc.memories.length===0)return null;
  if(Math.random()>.25)return null;
  var concepts=understanding?understanding.concepts:[];
  var candidates=[];
  npc.memories.forEach(function(m){
    if(!m.text)return;var score=0;
    concepts.forEach(function(c){
      var kw={危险:'危险',伤害:'伤',冲突:'吵',不公:'不公',财富:'钱',援助:'帮',外来者:'陌生',未知:'怪'};
      if(kw[c]&&m.text.indexOf(kw[c])>=0)score+=2;
    });
    if(score>0)candidates.push({mem:m,score:score});
  });
  if(candidates.length===0)return null;
  candidates.sort(function(a,b){return b.score-a.score;});
  var chosen=candidates[0].mem;
  var refs=[];
  if(chosen.text.indexOf('陌生')>=0)refs=['「上次那个陌生人，记得吗？」','「跟之前那事有点像」','「还记得那次吗…」'];
  else if(chosen.text.indexOf('伤')>=0)refs=['「上次有人受伤的事还记得吗？」','「跟上次那事差不多」'];
  else if(chosen.text.indexOf('吵')>=0)refs=['「上次吵架的事，还记得吧？」','「又来了，跟上次一样」'];
  else if(chosen.text.indexOf('钱')>=0)refs=['「上次那笔账还没算清呢」','「跟上次一样，又来？」'];
  else refs=['「上次的事还记得吗？」','「跟之前那件事有点像」','「这让我想起上次…」'];
  return refs[Math.floor(Math.random()*refs.length)];
}

// ═══════════════ 6. 记忆提炼与遗忘 ═══════════════
// 人脑会忘事，AI也会"失忆"。NPC对记忆进行压缩、抽象和遗忘
// 漏斗模型：原始事件 → 情感倾向值 → 抽象性格烙印
function consolidateMemories(npc){
  if(!npc.memories||npc.memories.length<3)return;
  // 每15 tick执行一次记忆提炼
  if(engineTick%15!==0)return;
  if(!npc.abstractMemory)npc.abstractMemory=[];
  // 取最近10条记忆，按情感倾向分组
  var recent=npc.memories.slice(0,10);
  var posCount=0,negCount=0,posEm=0,negEm=0;
  var subjects={}; // 按主语分组
  recent.forEach(function(m){
    if(m.em>0){posCount++;posEm+=m.em;}
    else{negCount++;negEm+=Math.abs(m.em);}
    // 提取主语
    var subMatch=m.text.match(/(.{2,6})(?:在|来|给|帮|打|偷|抢|说|骂|给|送|拿|做|干|找|丢)/);
    if(subMatch){var sub=subMatch[1];if(!subjects[sub])subjects[sub]={pos:0,neg:0,count:0};subjects[sub].count++;if(m.em>0)subjects[sub].pos++;else subjects[sub].neg++;}
  });
  // 提炼抽象结论
  var conclusions=[];
  // 结论1：总体情感倾向
  if(posCount>negCount*2&&posCount>=3){
    conclusions.push({text:'最近运气不错，遇到不少好事',confidence:Math.min(90,posCount*15)});
  }else if(negCount>posCount*2&&negCount>=3){
    conclusions.push({text:'最近不太顺，心情有些低落',confidence:Math.min(90,negCount*15)});
  }
  // 结论2：对特定人物的抽象印象
  for(var sub in subjects){
    var s=subjects[sub];
    if(s.count>=3){
      if(s.pos>s.neg*2){
        conclusions.push({text:sub+'是个好人，可以信任',confidence:Math.min(85,s.pos*20),subject:sub,valence:'positive'});
      }else if(s.neg>s.pos*2){
        conclusions.push({text:sub+'不太靠谱，得防着点',confidence:Math.min(85,s.neg*20),subject:sub,valence:'negative'});
      }else if(s.count>=4){
        conclusions.push({text:sub+'这人反复无常，说不准',confidence:Math.min(70,s.count*12),subject:sub,valence:'mixed'});
      }
    }
  }
  // 结论3：写入抽象记忆
  conclusions.forEach(function(c){
    // 去重：已有类似结论就更新置信度
    var existing=npc.abstractMemory.filter(function(a){return a.text===c.text;});
    if(existing.length>0){existing[0].confidence=Math.min(100,existing[0].confidence+5);existing[0].tick=engineTick;}
    else{npc.abstractMemory.push({text:c.text,confidence:c.confidence,subject:c.subject,valence:c.valence,tick:engineTick});}
  });
  // 抽象记忆衰减：置信度随时间降低
  npc.abstractMemory.forEach(function(a){if(engineTick-a.tick>30)a.confidence=Math.max(0,a.confidence-3);});
  // 清理低置信度记忆
  npc.abstractMemory=npc.abstractMemory.filter(function(a){return a.confidence>15;});
  // 限制数量
  if(npc.abstractMemory.length>10)npc.abstractMemory=npc.abstractMemory.slice(-10);
  // 清理原始记忆：旧记忆减半保留
  if(npc.memories.length>15){
    var keep=npc.memories.slice(0,8); // 保留最近8条
    npc.memories=keep.concat(npc.memories.slice(8).filter(function(m,i){return i%3===0;})); // 旧的每3条保留1条
  }
}
// 抽象记忆影响决策
function getAbstractMemoryBias(npc,targetId){
  if(!npc.abstractMemory||!targetId)return 0;
  var bias=0;
  var targetName=getNPC(targetId)?getNPC(targetId).name:'';
  npc.abstractMemory.forEach(function(a){
    if(a.subject&&a.subject===targetName){
      if(a.valence==='positive')bias+=a.confidence*.15;
      if(a.valence==='negative')bias-=a.confidence*.15;
      if(a.valence==='mixed')bias-=a.confidence*.05;
    }
  });
  return bias;
}

// 意图驱动的stem选择：根据意图标签偏置stem选择
function pickStemByIntent(bk,style,intent,npc){
  var stems=bk.stem[style]||bk.stem.normal||['……'];
  if(!intent||!intent.tags||intent.tags.length===0)return D_BLOCKS.pick(stems);
  // 根据意图标签，偏置选择（带意图的stem更可能被选中）
  var p=npc.personality;
  // 构建加权池：符合意图的stem权重更高
  var weighted=[];
  stems.forEach(function(s){
    var w=1; // 基础权重
    // 检查stem是否包含意图相关词
    intent.tags.forEach(function(tag){
      var tagWords={质问:['怎么回事','什么意思','干嘛','是不是'],不满:['不太高兴','皱着眉','板着脸'],对抗:['再说一遍','你试试','说道说道'],关心:['还好吧','没事吧','怎么了','还好吗'],安慰:['别怕','没事的','会好的','都会过去'],帮助:['我来','帮你','帮忙','搭把手'],回避:['不关我事','走了','溜了','走了'],好奇:['有意思','不对劲','怎么回事','什么情况'],观察:['看看','看了看','端详','打量'],分享:['听说了吗','你们知道','告诉你们','听说'],拒绝:['不用了','不了','不合适','不能要'],接受:['谢谢','收下','好'],否认:['不是我','没关系','搞错了','误会'],调解:['别急','消消气','好好说','别吵'],算计:['悄悄','靠近','套近乎','主意']};
      var tw=tagWords[tag];
      if(tw){tw.forEach(function(w2){if(s.indexOf(w2)>=0)w+=2;});}
    });
    weighted.push({stem:s,weight:w});
  });
  // 按权重排序，高权重更可能被选中
  weighted.sort(function(a,b){return b.weight-a.weight;});
  // 取前50%加权选择
  var topN=Math.max(1,Math.floor(weighted.length*.5));
  var topPool=weighted.slice(0,topN);
  return D_BLOCKS.pick(topPool.map(function(x){return x.stem;}));
}

function genDialogue(npc,aid,event,understanding){

// ═══════════════ 维度二：主观信念空间 ═══════════════
// 人类行为逻辑基于"他所相信的事实"，而非"世界的客观真实"
// 每个NPC有独立的信念库，信息通过社交传播，而非上帝视角全局同步
function syncBeliefs(fromNPC,toNPC,event){
  if(!fromNPC||!toNPC||!event)return;
  if(!fromNPC.beliefs)fromNPC.beliefs={};
  if(!toNPC.beliefs)toNPC.beliefs={};
  var beliefKey=event.type+'_'+event.text.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'').substring(0,10);
  // 传播者更新自己的信念为"确信"（置信度100）
  fromNPC.beliefs[beliefKey]={confidence:100,source:'direct',tick:engineTick,text:event.text,severity:event.severity||0};
  // 接收者根据信任度获得不同置信度
  var trust=REL[toNPC.id]&&REL[toNPC.id][fromNPC.id]?REL[toNPC.id][fromNPC.id].t:50;
  if(trust>30){
    // 置信度梯度：信任度越高，信念越确信
    var confidence=clamp(trust*.8+10,10,100); // 10-90 的置信度范围
    // 传播者身份加成：权威人物说的话更可信
    if(fromNPC.role==='村长')confidence=clamp(confidence+15,10,100);
    if(fromNPC.role==='侠客')confidence=clamp(confidence+10,10,100);
    // 如果传播者是自己信任的人（信任>70），置信度大幅提升
    if(trust>70)confidence=clamp(confidence+15,10,100);
    toNPC.beliefs[beliefKey]={confidence:confidence,source:'heard_from_'+fromNPC.id,tick:engineTick,text:event.text,severity:event.severity||0};
    // 间接听到的消息也触发情绪唤醒（但比直接目击弱）
    if(event.severity>40){
      toNPC.emotionalState.fear=clamp(toNPC.emotionalState.fear+event.severity*.15,0,100);
      toNPC.emotionalState.urgency=clamp(toNPC.emotionalState.urgency+event.severity*.1,0,100);
    }
    return true;
  }
  return false;
}

// NPC检查自己是否"知道"某个事件（用置信度代替二元判断）
function npcKnowsEvent(npc,event){
  if(!npc||!event)return false;
  if(!npc.beliefs)npc.beliefs={};
  var beliefKey=event.type+'_'+event.text.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'').substring(0,10);
  var belief=npc.beliefs[beliefKey];
  if(belief&&belief.confidence>=50&&(engineTick-belief.tick)<50)return true;
  return false;
}

// 获取NPC对事件的信念置信度
function getBeliefConfidence(npc,event){
  if(!npc||!event)return 0;
  if(!npc.beliefs)npc.beliefs={};
  var beliefKey=event.type+'_'+event.text.replace(/[^a-zA-Z\u4e00-\u9fa5]/g,'').substring(0,10);
  var belief=npc.beliefs[beliefKey];
  return belief?belief.confidence:0;
}

// 信念衰变：过期的信念逐渐失效，置信度随时间衰减
function decayBeliefs(npc){
  if(!npc.beliefs)npc.beliefs={};
  for(var key in npc.beliefs){
    var b=npc.beliefs[key];
    var age=engineTick-b.tick;
    if(age>50){
      delete npc.beliefs[key];
    }else if(age>20){
      // 超过20 tick的信念置信度开始衰减
      b.confidence=clamp(b.confidence-(age-20)*1.5,0,100);
    }
  }
}

function processEvent(event,perc,isChain){

  });

      if(npc.mood!==prevMood){

function triggerChain(aid,npc,event){
  if(chainDepth>=5)return; // v5.3: 2→5，允许更深的事件连锁反应

  var tags=getEventTags(event);

  if(bystanders.length===0)return;
  var chainEvent={
    text:'事件在村里扩散，周围人开始议论',
    type:'gossip_spread',

    tags:tags,

    availableActions:['ignore','gossip','investigate','ask','confront','sympathize','hide','mediate','deny']
  };
  chainDepth++;sbStats.chains++;
  setTimeout(function(){processEvent(chainEvent,chainEvent.perceivers,true);},5000);
}

// NPC根据状态+性格主动发起社交，非仅被动响应事件
function npcSocialTick(){
  // v5.3 时间感知：深夜社交概率大幅降低，傍晚（村口闲聊时段）提高
  var socialProb=.35; // 基础社交概率
  if(gameTime>22||gameTime<5){socialProb=.08;} // 深夜：几乎都在睡觉
  else if(gameTime>=18&&gameTime<21){socialProb=.5;} // 傍晚：村口闲聊黄金时段
  else if(gameTime>=12&&gameTime<14){socialProb=.25;} // 正午：吃饭午休，社交少
  if(Math.random()>socialProb)return;
  var candidates=NPCS.filter(function(n){
    return n.socialFatigue<70&&n.energy>15&&n.personality.社交>15; // v5.3: 降低门槛，让更多NPC能互动
  });
  if(candidates.length<2)return;
  var npc=candidates[Math.floor(Math.random()*candidates.length)];
  // 按信任度+亲近度选目标
  var targets=NPCS.filter(function(n){return n.id!==npc.id&&n.socialFatigue<70;});
  targets.sort(function(a,b){
    var tA=REL[npc.id]&&REL[npc.id][a.id]?REL[npc.id][a.id].t:50;
    var tB=REL[npc.id]&&REL[npc.id][b.id]?REL[npc.id][b.id].t:50;
    return (tB+Math.random()*25)-(tA+Math.random()*25);
  });
  if(targets.length===0)return;
  var target=targets[0];var tn=target.name;
  var p=npc.personality;
  // 根据性格+关系生成互动类型
  var trust=REL[npc.id]&&REL[npc.id][target.id]?REL[npc.id][target.id].t:50;
  var interactions=[];
  if(p.善良>55&&trust>40){interactions.push({text:npc.name+'走到'+tn+'身边，关心地问候了几句',type:'social_care',actions:['ask','sympathize','share'],target:target.id});}
  if(p.社交>55){interactions.push({text:npc.name+'拉着'+tn+'闲聊起来',type:'social_chat',actions:['gossip','ask','share'],target:target.id});}
  if(p.暴躁>60&&trust<45){interactions.push({text:npc.name+'看'+tn+'不顺眼，语气不善地说了几句',type:'social_argue',actions:['confront','deny'],target:target.id});}
  if(p.贪婪>60&&trust<50){interactions.push({text:npc.name+'凑到'+tn+'跟前，似乎在打什么主意',type:'social_scheme',actions:['exploit','ask'],target:target.id});}
  if(p.好奇>60){interactions.push({text:npc.name+'好奇地凑到'+tn+'旁边，打听最近的事',type:'social_curious',actions:['ask','investigate'],target:target.id});}
  if(p.勤劳>55&&p.善良>45){interactions.push({text:npc.name+'主动帮'+tn+'的忙',type:'social_help',actions:['help','share'],target:target.id});}
  // 通用闲聊
  interactions.push({text:npc.name+'碰见'+tn+'，停下来聊了几句',type:'social_chat',actions:['ask','gossip','share'],target:target.id});
  interactions.push({text:npc.name+'跟'+tn+'打了个招呼，寒暄了几句',type:'social_chat',actions:['ask','share'],target:target.id});
  var chosen=interactions[Math.floor(Math.random()*interactions.length)];
  var event={
    text:chosen.text,type:chosen.type,severity:15+Math.floor(Math.random()*10),
    target:chosen.target,isSocial:true,
    perceivers:[npc.id,chosen.target],
    availableActions:chosen.actions
  };
  chainDepth=0;processEvent(event,event.perceivers,false);
}

function autonomousTick(){
  if(!engineRunning)return;if(_tickInProgress){scheduleNextTick();return;}
  _lastTickTime=performance.now();
  try{
  _tickStartTime=performance.now();_tickInProgress=true;chainDepth=0;
  engineTick++;
  // 昼夜推进：每Tick约0.125小时，一天约20分钟
  gameTime=(gameTime+(TIME_PER_TICK*.6+Math.random()*TIME_PER_TICK*.8))%24;
  // 天气随机变化：15%概率切换
  if(Math.random()<.15){var w=['clear','clear','clear','rain','rain','fog','wind'];weather=w[Math.floor(Math.random()*w.length)];}
  // 每Tick更新所有NPC内稳态
  NPCS.forEach(function(n){ensureNPCFields(n);updateHomeostasis(n);});
  // NPC自主互动：NPC主动发起社交
  npcSocialTick();
  
  // ═══════════ v5.3 核心修复：每Tick处理多个NPC，而非仅一个 ═══════════
  // 随机打乱NPC顺序，取前2-3个处理，确保每个NPC都有机会行动
  var shuffled=NPCS.slice().sort(function(){return Math.random()-.5;});
  var activeCount=Math.min(shuffled.length,Math.floor(2+Math.random()*2)); // 2-3个NPC
  _allowConcurrent=true; // 允许同tick内多个事件并发处理
  
  for(var ai=0;ai<activeCount;ai++){
    var npc=shuffled[ai];
    
    // 1. 检查中断（愤怒溢出/社交透支/饥饿）
    if(checkInterrupts(npc)){
      var step=npc.planQueue.shift();
      if(step){
        var intrEvent={
          text:npc.activeGoal.text,
          type:npc.activeGoal.type||'daily',
          severity:40,
          target:npc.activeGoal.target||null,
          perceivers:[npc.id],
          availableActions:[step.aid]
        };
        chainDepth=0;processEvent(intrEvent,intrEvent.perceivers,false);
      }
      continue;
    }
    
    // 2. v5.3 新增：记忆驱动 — NPC基于近期重大事件自主产生目标
    if((!npc.activeGoal||npc.planQueue.length===0)&&Math.random()<.4){
      var memMotive=generateMemoryMotive(npc);
      if(memMotive){
        npc.activeGoal=memMotive;
        npc.planQueue=compilePlan(npc,memMotive);
      }
    }
    
    // 3. 如果没有计划或计划已执行完，生成新目标
    if(!npc.activeGoal||npc.planQueue.length===0){
      var motive=generateMotive(npc);
      if(motive){
        npc.activeGoal=motive;
        npc.planQueue=compilePlan(npc,motive);
      }
    }
    
    // 4. 执行当前计划的第一步
    if(npc.activeGoal&&npc.planQueue.length>0){
      var step=npc.planQueue.shift();
      var planEvent={
        text:npc.activeGoal.text||(npc.name+step.desc),
        type:npc.activeGoal.type||'daily',
        severity:npc.activeGoal.severity||20,
        target:npc.activeGoal.target||null,
        perceivers:[npc.id],
        availableActions:[step.aid]
      };
      chainDepth=0;processEvent(planEvent,planEvent.perceivers,false);
    }else{
      // ═══════════ v5.2 修复：无动机时NPC也做默认行为，确保引擎始终有可见输出 ═══════════
      var defaultActs=[
        {text:npc.name+'在村里闲逛',aid:'investigate'},
        {text:npc.name+'在门口坐着发呆',aid:'ignore'},
        {text:npc.name+'整理手头的东西',aid:'ignore'},
        {text:npc.name+'站在路口张望',aid:'investigate'},
        {text:npc.name+'靠在墙边歇息',aid:'ignore'},
        {text:npc.name+'在井边打水',aid:'help'},
        {text:npc.name+'在树下乘凉',aid:'ignore'},
        {text:npc.name+'蹲在路边，不知道在看什么',aid:'investigate'},
        {text:npc.name+'自言自语',aid:'ignore'},
        {text:npc.name+'伸了个懒腰',aid:'ignore'}
      ];
      var defAct=defaultActs[Math.floor(Math.random()*defaultActs.length)];
      var defEvent={
        text:defAct.text,type:'daily',severity:3,target:null,
        perceivers:[npc.id],availableActions:[defAct.aid]
      };
      // 15%概率输出Feed行，避免刷屏
      if(Math.random()<.15)addLine('<span class="fl-icon">🚶</span><span class="fl-content"><span class="fl-opinion" style="color:'+npc.color+'">'+defAct.text+'</span></span><span class="fl-time"></span>',true);
      if(defAct.aid==='ignore'){npc.energy=clamp(npc.energy+2,0,100);npc.socialFatigue=clamp(npc.socialFatigue-1,0,100);}
      else if(defAct.aid==='investigate'){npc.happiness=clamp(npc.happiness+1,0,100);}
      else if(defAct.aid==='help'){npc.energy=clamp(npc.energy-3,0,100);npc.happiness=clamp(npc.happiness+2,0,100);}
    }
  }
  _allowConcurrent=false; // v5.3: 恢复跨tick保护
  _tickLatency=performance.now()-_tickStartTime;_tickInProgress=false;
  updatePerfMonitors();
  }catch(e){
    console.error('[灵魂工坊] autonomousTick崩溃:',e.message,e.stack);
    _tickInProgress=false;_allowConcurrent=false;
    _healthIssues.push({time:Date.now(),type:'ENGINE_CRASH',msg:e.message,stack:e.stack});
  }
  scheduleNextTick();
}
function scheduleNextTick(){if(!engineRunning)return;var interval=8000-TEMPERATURE*35;interval=interval*(.8+Math.random()*.4);engineTimer=setTimeout(autonomousTick,interval);}
function updatePerfMonitors(){
  var latEl=document.getElementById('sb-latency');if(latEl)latEl.textContent=_tickLatency.toFixed(1)+'ms';
  var mslEl=document.getElementById('msb-latency');if(mslEl)mslEl.textContent=_tickLatency.toFixed(1)+'ms';
  // 堆内存监测（Chrome可用）
  if(window.performance&&performance.memory){
    var memMB=(performance.memory.usedJSHeapSize/1048576).toFixed(1);
    var memEl=document.getElementById('sb-mem');if(memEl)memEl.textContent=memMB+'MB';
  }
}

    暴躁:['暴躁','易怒','急性子','脾气大','冲动','火爆','不耐烦','暴怒','火气','发火','暴','摔','吼','怒'],
    好奇:['好奇','好学','爱打听','八卦','探索','求知','刨根问底','好学','疑问','追问','琢磨','研究','观察','打量'],
    社交:['爱说话','外向','健谈','喜欢热闹','爱交朋友','人来疯','能说会道','交际','串门','聚会','人缘','招呼','聊','热闹'],
    勤劳:['勤劳','勤快','能干','忙碌','起早贪黑','不怕苦','任劳任怨','劳作','干活','勤','苦干','辛劳','拼','忙'],
    懒惰:['懒惰','懒散','好吃懒做','游手好闲','偷懒','不爱动','混日子','懒','闲','躺','睡','歇','晃','混']
  };
  // 负面经历修正：影响多个维度
  var negativeMods={
    '失去':{沉默:8,善良:-5,贪婪:5},
    '死了':{沉默:10,善良:-3,勇敢:5},
    '火灾':{沉默:5,贪婪:8,勇敢:3},
    '欺骗':{沉默:8,社交:-5,正义:-5},
    '背叛':{沉默:10,社交:-8,勇敢:-5},
    '贫穷':{贪婪:10,沉默:5,勤劳:8},
    '欺负':{沉默:8,勇敢:5,社交:-5},
    '抛弃':{沉默:12,社交:-8,善良:-5},
    '孤独':{沉默:15,社交:-8,好奇:5},
    '创伤':{沉默:8,勇敢:-5,暴躁:5}
  };
  var scores={正义:50,勇敢:50,沉默:50,贪婪:50,善良:50,暴躁:50,好奇:50,社交:50,勤劳:50,懒惰:50};
  var hits=[]; // 记录命中关键词
  // 第一轮：关键词匹配
  for(var trait in keywords){
    keywords[trait].forEach(function(kw){
      var re=new RegExp(kw,'g');var count=(text.match(re)||[]).length;
      if(count>0){
        var delta=Math.min(count*6, 18); // 每个关键词+6，最多+18
        scores[trait]+=delta;
        if(count>=2)hits.push(trait+'('+delta+')');
      }
    });
  }
  // 第二轮：负面经历修正
  for(var neg in negativeMods){
    if(text.indexOf(neg)>-1){
      var mods=negativeMods[neg];
      for(var t in mods){scores[t]+=mods[t];}
      hits.push(neg+'→'+Object.keys(mods).map(function(t){return t+(mods[t]>0?'+':'')+mods[t];}).join(' '));
    }
  }
  // 第三轮：对立维度平衡（懒惰高→勤劳低，反之亦然）
  if(scores['勤劳']>65&&scores['懒惰']>55){scores['懒惰']=Math.max(20,scores['懒惰']-15);}
  if(scores['社交']>70&&scores['沉默']>55){scores['沉默']=Math.max(20,scores['沉默']-10);}
  // 第四轮：钳制到0-100，应用滑块
  for(var t in scores){scores[t]=Math.round(Math.max(0,Math.min(100,scores[t])));}
  traits.forEach(function(t){
    var slider=document.getElementById('ct-'+t);var val=document.getElementById('ctv-'+t);
    if(slider){slider.value=scores[t];}if(val){val.textContent=scores[t];}
  });
  // 自动推断说话风格
  var style='normal';
  if(scores['沉默']>70)style='沉默寡言';
  else if(scores['社交']>70)style='絮絮叨叨';
  else if(scores['善良']>70&&scores['暴躁']<30)style='温温柔柔';
  document.getElementById('c-style').value=style;
  // 显示分析结果
  var resultEl=document.getElementById('analyze-result');
  var topTraits=Object.entries(scores).filter(function(e){return e[1]>=70||e[1]<=30;}).sort(function(a,b){return Math.abs(b[1]-50)-Math.abs(a[1]-50);});
  var topLabels=topTraits.slice(0,4).map(function(e){return '<span class="ar-hit">'+e[0]+':'+e[1]+'</span>';}).join(' ');
  resultEl.innerHTML='分析完成：'+topLabels+(hits.length>0?' (命中:'+hits.join(',')+')':'');
  updateCreatePreview();
}
