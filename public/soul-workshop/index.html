// ═══════════════ AI Agent 对话推理系统 (Option A) ═══════════════
var _agentSteps=[];
var _agentSimulating=false;
var _agentTimer=null;
var _agentNpcName='—';

function logAgentStep(type,text,meta){
  _agentSteps.push({t:type,txt:text,meta:meta||null,time:now()});
  if(_agentSteps.length>50)_agentSteps.shift();
  if(currentView==='agent-console'){
    var body=document.getElementById('agent-body');
    if(body){
      var empty=body.querySelector('.agent-empty');
      if(empty)empty.remove();
      var stepHtml='';
      var labelMap={system:'SYSTEM',tool:'TOOL CALL',reflex:'REFLEX',decision:'DECISION',percept:'PERCEPT'};
      var clsMap={system:'system',tool:'tool',reflex:'reflex',decision:'decision',percept:''};
      stepHtml+='<div class="agent-step '+(clsMap[type]||'')+'">';
      stepHtml+='<div class="agent-step-label '+(clsMap[type]||'')+'">'+(labelMap[type]||type).toUpperCase()+'</div>';
      stepHtml+='<div class="agent-step-text">'+text+'</div>';
      if(meta&&meta.length>0){
        stepHtml+='<div class="agent-kv">';
        meta.forEach(function(m){stepHtml+='<span class="agent-kv-item"><span class="agent-kv-key">'+m.k+'</span> '+m.v+'</span>';});
        stepHtml+='</div>';
      }
      stepHtml+='<div class="agent-step-meta">'+(type==='decision'?'⚖ 决策输出':type==='reflex'?'⚡ 直觉反射':type==='tool'?'🔧 工具调用':'🤖 Agent')+' · '+now()+'</div>';
      stepHtml+='</div>';
      body.insertAdjacentHTML('beforeend',stepHtml);
      body.scrollTop=body.scrollHeight;
    }
  }
}

function simulateAgentChain(event,npc,thoughtResult){
  _agentNpcName=npc.name;
  var npcId=npc.id;
  // 1. Perception
  logAgentStep('percept',npc.name+' 感知到事件：「'+(event.text||'未知事件')+'」',[{k:'severity',v:event.severity||'—'},{k:'type',v:event.type||'—'}]);
  // 2. Semantic Understanding
  var tags=getEventTags(event);
  var conceptLabel=tags.slice(0,3).map(function(t){return t}).join('·');
  logAgentStep('tool','语义理解引擎：关键词提取→概念激活',[{k:'concepts',v:conceptLabel||'无激活'}]);
  // 3. Memory Feedback
  logAgentStep('tool','记忆反馈层：检索相关长期记忆',[{k:'npc',v:npc.name},{k:'memories',v:(npc.memories||[]).length+'条'}]);
  // 4. Emotion Space
  var newE=thoughtResult.newE||{anger:'—',trust:'—',happiness:'—'};
  logAgentStep('tool','情绪空间映射：计算情绪偏移',[{k:'anger',v:newE.anger},{k:'trust',v:newE.trust},{k:'happy',v:newE.happiness}]);
  // 5. Decision
  var chosen=thoughtResult.chosen||null;
  if(thoughtResult.reflex){
    logAgentStep('reflex','System 1 直觉反射：'+(thoughtResult.reflexReason||'反射触发'),[{k:'action',v:chosen&&chosen.name?chosen.name:'?'}]);
  }else if(chosen){
    logAgentStep('decision','System 2 理性决策：多方案权衡评分',[{k:'choice',v:chosen.name},{k:'score',v:chosen.score}]);
  }else{
    logAgentStep('decision','System 2 理性决策：无推荐方案',[{k:'choice',v:'无'}, {k:'score',v:'—'}]);
  }
  // 6. Behavior Generation
  logAgentStep('decision','行为生成：「'+npc.name+'」决定'+((thoughtResult.chosen||{}).name||'观察')+'',[{k:'worldline',v:'已校验'}]);
}

  if(_agentSteps.length===0){
    body.innerHTML='<div class="agent-empty"><span class="deicon">🤖</span>事件触发后，Agent 推理链将在此展示</div>';
    return;
  }
  var html='';
  _agentSteps.forEach(function(s){
    var labelMap={system:'SYSTEM',tool:'TOOL CALL',reflex:'REFLEX',decision:'DECISION',percept:'PERCEPT'};
    var clsMap={system:'system',tool:'tool',reflex:'reflex',decision:'decision',percept:''};
    html+='<div class="agent-step '+(clsMap[s.t]||'')+'">';
    html+='<div class="agent-step-label '+(clsMap[s.t]||'')+'">'+(labelMap[s.t]||s.t).toUpperCase()+'</div>';
    html+='<div class="agent-step-text">'+s.txt+'</div>';
    if(s.meta&&s.meta.length>0){
      html+='<div class="agent-kv">';
      s.meta.forEach(function(m){html+='<span class="agent-kv-item"><span class="agent-kv-key">'+m.k+'</span> '+m.v+'</span>';});
      html+='</div>';
    }
    html+='<div class="agent-step-meta">'+(s.t==='decision'?'⚖ 决策输出':s.t==='reflex'?'⚡ 直觉反射':s.t==='tool'?'🔧 工具调用':'🤖 Agent')+' · '+s.time+'</div>';

  });
  body.innerHTML=html;

}

var _pipelineLayersState=[{id:'perception',state:'idle'},{id:'semantic',state:'idle'},{id:'memory',state:'idle'},{id:'emotion',state:'idle'},{id:'decision',state:'idle'},{id:'behavior',state:'idle'}];
var _pipelineLogs=[];
var _pipelineLastEvent=null;

function initPipelineState(){
  _pipelineLayersState.forEach(function(l){l.state='idle';});
  _pipelineLogs=[];
  _pipelineLastEvent=null;
}

function updatePipelineLayer(id,state,logText){
  var layer=_pipelineLayersState.find(function(l){return l.id===id;});
  if(layer)layer.state=state;
  if(logText){
    _pipelineLogs.push({layer:id,text:logText,time:now()});
    if(_pipelineLogs.length>80)_pipelineLogs.shift();
  }
  if(currentView==='pipeline'){
    renderPipelineLayers();
    renderPipelineLog();
  }
}

function triggerPipelineForEvent(event,npc,thoughtResult){
  _pipelineLastEvent={npc:npc.name,event:event};
  // 重置并保留静态展示（面板打开时能看到上次事件的最终状态）
  _pipelineLayersState.forEach(function(l){l.state='idle';});
  _pipelineLastEvent.done=true;
  updatePipelineLayer('perception','active','感知：'+npc.name+' 捕获事件「'+(event.text||'—').substring(0,20)+'」');
  setTimeout(function(){
    updatePipelineLayer('perception','done','✓ 感知完成，事件进入理解队列');
    updatePipelineLayer('semantic','active','理解：提取关键词→激活概念→性格透镜加权');
  },600);
  setTimeout(function(){
    var tags=getEventTags(event);
    updatePipelineLayer('semantic','done','✓ 激活概念：'+(tags.slice(0,3).join('·')||'无'));
    updatePipelineLayer('memory','active','记忆：检索 '+npc.name+' 相关记忆');
  },1200);
  setTimeout(function(){
    updatePipelineLayer('memory','done','✓ 回忆完成，形成判断');
    updatePipelineLayer('emotion','active','情绪：计算 6 维情绪偏移');
  },1800);
  setTimeout(function(){
    var ne=thoughtResult.newE||{anger:'—',trust:'—',happiness:'—'};
    updatePipelineLayer('emotion','done','✓ 情绪更新：anger='+ne.anger+' trust='+ne.trust+' happy='+ne.happiness);
    updatePipelineLayer('decision','active','决策：'+(thoughtResult.reflex?'System1 直觉反射':'System2 理性评分'));
  },2400);
  setTimeout(function(){
    var chosen=(thoughtResult.chosen||{});
    updatePipelineLayer('decision','done','✓ 选择行为：'+(chosen.name||'?'));
    updatePipelineLayer('behavior','active','行为：生成具体动作文本');
  },3000);
  setTimeout(function(){
    updatePipelineLayer('behavior','done','✓ 执行完成：'+npc.name+' → '+(chosen.name||'观察'));
    // 不再重置，保留静态最终状态供面板查看
  },3600);
}

function renderPipelineLayers(){
  var el=document.getElementById('pipeline-layers');
  if(!el)return;
  var html='';
  _pipelineLayers.forEach(function(layer,i){
    var state=_pipelineLayersState.find(function(l){return l.id===layer.id;});
    var st=state?state.state:'idle';
    html+='<div class="pl-layer '+(st==='idle'?'':st)+'" id="pl-'+layer.id+'">';
    html+='<span class="pl-num">'+(i+1)+'</span>';
    html+='<div class="pl-info"><div class="pl-name">'+layer.icon+' '+layer.name+'</div><div class="pl-desc">'+layer.desc+'</div></div>';
    var stLabel=st==='processing'?'⚙ 执行中':st==='active'?'▶ 活跃':st==='done'?'✓ 完成':'· 待机';
    html+='<span class="pl-status">'+stLabel+'</span></div>';
    if(i<_pipelineLayers.length-1)html+='<div class="pl-arrow">↓</div>';
  });
  el.innerHTML=html;
}

function renderPipelineLog(){
  var el=document.getElementById('pipeline-log');
  if(!el)return;
  if(_pipelineLogs.length===0){
    el.innerHTML='<div style="font-size:10px;color:var(--text-muted);padding:8px;text-align:center;opacity:.4">等待引擎事件…</div>';
    return;
  }
  var html='';
  _pipelineLogs.slice().reverse().forEach(function(log){
    html+='<div class="pl-entry '+log.layer+'">['+log.time+'] '+(log.text||'')+'</div>';
  });
  el.innerHTML=html;
}

var _panelZ=10;
var _dragState=null;
document.querySelectorAll('.glass').forEach(function(panel){
  var handle=panel.querySelector('[data-drag-handle]');
  if(!handle)return;
  handle.addEventListener('mousedown',function(e){
    if(e.target.closest('button')||e.target.closest('input')||e.target.closest('.detail-track'))return;
    e.preventDefault();
    var rect=panel.getBoundingClientRect();
    _dragState={panel:panel,startX:e.clientX,startY:e.clientY,origLeft:rect.left,origTop:rect.top};
    _panelZ+=1;panel.style.zIndex=_panelZ;
    panel.classList.add('dragging');
    document.addEventListener('mousemove',onPanelDrag);
    document.addEventListener('mouseup',onPanelDrop);
  });
});
function onPanelDrag(e){
  if(!_dragState)return;
  var dx=e.clientX-_dragState.startX,dy=e.clientY-_dragState.startY;
  _dragState.panel.style.left=(_dragState.origLeft+dx)+'px';
  _dragState.panel.style.top=(_dragState.origTop+dy)+'px';
  _dragState.panel.style.right='auto';_dragState.panel.style.bottom='auto';
}
function onPanelDrop(){
  if(!_dragState)return;
  _dragState.panel.classList.remove('dragging');
  _dragState=null;
  document.removeEventListener('mousemove',onPanelDrag);
  document.removeEventListener('mouseup',onPanelDrop);
}

// ═══════════════ ANIMATION ═══════════════
const targetPos=new THREE.Vector3();
function animate(t){
  requestAnimationFrame(animate);const dt=Math.min((t-(animate._last||t))*.001,.1);animate._last=t;
  raycaster.setFromCamera(mouseNDC,camera);raycaster.ray.at(12,mouseWorld);
  const engineMult=engineRunning?1:.3;
  // 相机平滑复位
  if(cameraResetting){
    camera.position.lerp(cameraTarget,.08);
    const curLook=new THREE.Vector3();camera.getWorldDirection(curLook);
    const targetLook=lookTarget.clone().sub(camera.position).normalize();
    const midLook=new THREE.Vector3().copy(curLook).lerp(targetLook,.08).normalize();
    const midPoint=camera.position.clone().add(midLook);
    camera.lookAt(midPoint);
    if(camera.position.distanceTo(cameraTarget)<.05){camera.position.copy(cameraTarget);camera.lookAt(lookTarget);cameraResetting=false;}
  }
  npcNodes.forEach((n,i)=>{
    const npcData=NPCS[i];if(!npcData)return;
    const moodColor=npcData.anger>50?new THREE.Color('#f87171'):npcData.happiness>60?new THREE.Color('#4ade80'):npcData.happiness<30?new THREE.Color('#ffa84d'):new THREE.Color(npcData.color);
    n.mat.color.lerp(moodColor,.03);
    n.mesh.position.x=n.basePos.x+Math.sin(t*.0008*engineMult+i)*.4*engineMult;
    n.mesh.position.y=n.basePos.y+Math.cos(t*.0007*engineMult+i*1.3)*.3*engineMult;
    // 事件脉冲：NPC参与事件时球体缩放+发光
    if(n.pulseTime>0){
      n.pulseTime-=dt;var pulsePhase=Math.sin(n.pulseTime*12)*Math.max(0,n.pulseTime/1.5);
      var pulseScale=1+pulsePhase*.25;
      n.mesh.scale.setScalar(pulseScale);
      n.mat.emissive=new THREE.Color('#f0b958').multiplyScalar(pulsePhase*.5);
      n.mat.emissiveIntensity=pulsePhase*1.2;
      n.wire.material.opacity=.15+pulsePhase*.25;
      if(n.pulseTime<=0){n.mesh.scale.setScalar(1);n.pulseTime=0;}
    }
    // 磁吸悬停：悬停的NPC球体微向光标位置靠近
    if(_magneticNPC===i&&engineMult>0){
      var mx=lerpL(n.mesh.position.x,mouseWorld.x,.06);
      var my=lerpL(n.mesh.position.y,mouseWorld.y,.06);
      n.mesh.position.x=mx;n.mesh.position.y=my;
    }
    const distToMouse=n.mesh.position.distanceTo(mouseWorld);const pf=Math.max(0,1-distToMouse/2.5)*engineMult;
    n.mat.emissive=new THREE.Color().copy(moodColor).multiplyScalar(pf*.1);n.mat.emissiveIntensity=pf*.6;
    n.wire.material.opacity=.06+pf*.12+(npcData.id===selectedNPC?.08:0);
    if(npcData.id===selectedNPC){n.wire.material.color.set('#f0b958');n.wire.material.opacity=.2+pf*.12;}
    if(n.mesh.userData.shader){n.mesh.worldToLocal(targetPos.copy(mouseWorld));n.mesh.userData.shader.uniforms.uMouseLocal.value.copy(targetPos);}
  });
  linkLines.forEach(({line,mat,indices})=>{if(!npcNodes[indices[0]]||!npcNodes[indices[1]])return;const a=npcNodes[indices[0]].mesh.position,b=npcNodes[indices[1]].mesh.position;const pa=line.geometry.attributes.position.array;pa[0]=a.x;pa[1]=a.y;pa[2]=a.z;pa[3]=b.x;pa[4]=b.y;pa[5]=b.z;line.geometry.attributes.position.needsUpdate=true;const nidA=NPCS[indices[0]].id,nidB=NPCS[indices[1]].id;const relTrust=REL[nidA]&&REL[nidA][nidB]?REL[nidA][nidB].t:50;mat.opacity=lerpL(mat.opacity,(.04+(relTrust/100)*.12)*engineMult,.03);});
  shadowPlanes.forEach((sp,i)=>{if(!npcNodes[i])return;sp.position.x=npcNodes[i].mesh.position.x;sp.position.z=npcNodes[i].mesh.position.z;sp.material.opacity=lerpL(sp.material.opacity,(.25+(npcNodes[i].mesh.position.y+3.5)/6*.15)*engineMult,.05);});
  ringGlow.material.opacity=lerpL(ringGlow.material.opacity,.08*engineMult,.03);
  ring.material.emissiveIntensity=lerpL(ring.material.emissiveIntensity,.4*engineMult,.03);
  ringOuter.material.opacity=lerpL(ringOuter.material.opacity,.03*engineMult,.03);
  centerGlow.intensity=lerpL(centerGlow.intensity,3.5*engineMult,.05);
  topGlow.intensity=lerpL(topGlow.intensity,2.5*engineMult,.03);
  particles1.rotation.y+=dt*.03*engineMult;particles2.rotation.y-=dt*.02*engineMult;
  particles2.rotation.x+=dt*.015*engineMult;
  mouseTrail.geometry.attributes.position.needsUpdate=true;
  updateStatusBar();update3DLabels();renderer.render(scene,camera);
  // 图例渐隐
  if(_legendTimer===null){_legendTimer=setTimeout(function(){document.getElementById('scene-legend').classList.add('fading');},8000);}
}

// ═══════════ v5.4 健康自检系统：每30s自动诊断，控制台 window.healthCheck() 手动触发 ═══════════
window.healthCheck=function(verbose){
  var issues=[],warnings=[],now=Date.now();
  // 1. 引擎死锁检测：_tickInProgress超过30s未释放
  if(_tickInProgress&&_lastTickTime>0&&(now-_lastTickTime)>30000){
    issues.push({type:'ENGINE_DEADLOCK',msg:'_tickInProgress stuck for '+(now-_lastTickTime)+'ms',fix:'manual: engineRunning=false; engineRunning=true 重启引擎'});
  }
  // 2. 引擎停转检测：运行中但无定时器
  if(engineRunning&&!engineTimer){
    issues.push({type:'ENGINE_STALL',msg:'engineRunning=true but engineTimer=null',fix:'auto: scheduleNextTick()'});
  }
  // 3. 引擎空闲检测：超过2分钟无tick
  if(engineRunning&&_lastTickTime>0&&(now-_lastTickTime)>120000){
    issues.push({type:'ENGINE_IDLE',msg:'No tick for '+(now-_lastTickTime)+'ms',fix:'auto: scheduleNextTick()'});
  }
  // 4. DOM-NPC数量失配
  var listEl=document.getElementById('npc-list');
  if(listEl){
    var items=listEl.querySelectorAll('[data-npc-id]');
    if(items.length!==NPCS.length){
      issues.push({type:'DOM_DESYNC',msg:'List has '+items.length+' items, NPCS has '+NPCS.length,fix:'auto: _npcListCount=-1; renderList()'});
    }
    // 检查每个NPC是否有对应DOM元素
    NPCS.forEach(function(n){
      if(!listEl.querySelector('[data-npc-id="'+n.id+'"]')){
        issues.push({type:'DOM_MISSING',msg:'NPC '+n.id+' ('+n.name+') not in DOM list',fix:'auto: _npcListCount=-1; renderList()'});
      }
    });
  }
  // 5. 选中NPC有效性
  if(selectedNPC&&!getNPC(selectedNPC)){
    issues.push({type:'INVALID_SELECTION',msg:'selectedNPC='+selectedNPC+' does not exist',fix:'auto: selectedNPC=NPCS[0].id; renderList(); hideDetail()'});
  }
  // 6. Feed队列溢出
  if(_feedQueue.length>30){
    issues.push({type:'QUEUE_OVERFLOW',msg:'_feedQueue has '+_feedQueue.length+' items',fix:'auto: _feedQueue=[]; clearTimeout(_feedTimer); _feedTimer=null'});
  }
  // 7. REL矩阵泄漏：存在已删除NPC的关系条目
  var npcIds={};
  NPCS.forEach(function(n){npcIds[n.id]=true;});
  var relLeakCount=0;
  Object.keys(REL).forEach(function(k){if(!npcIds[k])relLeakCount++;});
  if(relLeakCount>0){
    warnings.push({type:'REL_LEAK',msg:relLeakCount+' REL entries for deleted NPCs',fix:'auto: cleanup'});
  }
  // 8. _npcListCount 与实际不符（但count相同）
  if(_npcListCount!==NPCS.length&&_npcListCount!==-1){
    warnings.push({type:'LIST_COUNT_STALE',msg:'_npcListCount='+_npcListCount+' but NPCS.length='+NPCS.length,fix:'auto: _npcListCount=-1'});
  }
  // 输出
  if(verbose||issues.length>0){
    if(issues.length>0){console.warn('[健康检查] '+issues.length+'个问题:',issues);}
    if(warnings.length>0&&verbose){console.info('[健康检查] '+warnings.length+'个警告:',warnings);}
    if(issues.length===0&&warnings.length===0){console.log('[健康检查] ✓ 系统正常 — tick:'+engineTick+' NPCs:'+NPCS.length+' latency:'+_tickLatency.toFixed(1)+'ms');}
  }
  return {time:now,issues:issues,warnings:warnings,ok:issues.length===0};
};
// 自动修复函数
function _autoHeal(issues){
  issues.forEach(function(i){
    switch(i.type){
      case 'ENGINE_STALL':case 'ENGINE_IDLE':scheduleNextTick();break;
      case 'DOM_DESYNC':case 'DOM_MISSING':_npcListCount=-1;renderList();break;
      case 'INVALID_SELECTION':selectedNPC=NPCS[0]?NPCS[0].id:'';renderList();hideDetail();break;
      case 'QUEUE_OVERFLOW':_feedQueue=[];clearTimeout(_feedTimer);_feedTimer=null;break;
    }
  });
}
function _startHealthMonitor(){
  if(_healthTimer)clearInterval(_healthTimer);
  _healthTimer=setInterval(function(){
    var r=window.healthCheck(false);
    if(r.issues.length>0){
      console.warn('[健康监控] 自动修复 '+r.issues.length+' 个问题');
      _autoHeal(r.issues);
      _healthIssues=_healthIssues.concat(r.issues);
    }
  },30000);
}
_startHealthMonitor();
requestAnimationFrame(animate);

});
