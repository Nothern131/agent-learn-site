<!DOCTYPE html><!-- v5.3 Hallmark: OKLCH palette + anti-slop cleanup -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>灵魂工坊 · SOUL WORKSHOP v4</title>
<style>
/* ═══════════════ Hallmark Design System · OKLCH palette · warm-amber anchor ═══════════════ */
:root{
  /* Paper layers — tinted dark, never pure black */
  --bg-deep:oklch(12% 0.008 45);--bg-surface:oklch(16% 0.010 45);--bg-surface-hover:oklch(20% 0.012 45);
  --bg-elevated:oklch(22% 0.010 45);
  /* Ink — tinted light, never pure white */
  --text-primary:oklch(94% 0.006 80);--text-secondary:oklch(78% 0.006 80);--text-muted:oklch(56% 0.008 70);
  /* Rules — subtle borders, not glows */
  --rule:oklch(30% 0.008 45);--rule-subtle:oklch(24% 0.006 45);
  /* Accents — max 2: gold (primary), jade (engine status) */
  --gold:#f0b958;--jade:#4ade80;
  /* Semantic colors — kept for NPC identity, not UI accents */
  --amber:#ffa84d;--crimson:#f87171;--azurite:#60a5fa;--purple:#c084fc;
  /* Typography */
  --mono:'JetBrains Mono','Cascadia Code','Consolas',monospace;
  --sans:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  /* Motion */
  --ease:cubic-bezier(.4,0,.2,1);--ease-bounce:cubic-bezier(.34,1.56,.64,1);
  /* Borders — hairline rules, not glows */
  --border-subtle:0 0 0 1px oklch(100% 0 0/.06);
  --border-hover:0 0 0 1px oklch(100% 0 0/.12);
  --radius:12px;--radius-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:transparent}
body{font-family:var(--sans);font-size:16px;line-height:1.7;color:var(--text-secondary);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.5)}}
@keyframes blink{50%{opacity:0}}
@keyframes valuePop{0%{transform:scale(1)}30%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes panelIn{from{opacity:0;transform:translateX(60px) scale(.96)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes enginePulse{0%,100%{border-color:oklch(100% 0 0/.04);box-shadow:0 0 12px rgba(74,222,128,.06)}50%{border-color:oklch(100% 0 0/.08);box-shadow:0 0 24px rgba(74,222,128,.12)}}
@keyframes engineRingSpin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes engineDotBreath{0%,100%{opacity:.6;box-shadow:0 0 6px rgba(74,222,128,.3)}50%{opacity:1;box-shadow:0 0 14px rgba(74,222,128,.5)}}
@keyframes sceneDim{from{opacity:1}to{opacity:.35}}
/* v5.3 纪事词条优雅入场：避免闪烁，逐条呈现 */
@keyframes feedSlideIn{
  0%{opacity:0;transform:translateY(8px) scale(.98);max-height:0;padding-top:0;padding-bottom:0;margin-bottom:0}
  40%{opacity:0;transform:translateY(8px) scale(.98)}
  100%{opacity:1;transform:translateY(0) scale(1);max-height:60px;padding-top:7px;padding-bottom:7px}
}
@keyframes feedGlow{
  0%{box-shadow:inset 2px 0 0 var(--gold),0 0 12px rgba(240,185,88,.15)}
  60%{box-shadow:inset 2px 0 0 var(--gold),0 0 12px rgba(240,185,88,.15)}
  100%{box-shadow:inset 2px 0 0 transparent,0 0 0 transparent}
}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(0);opacity:.8}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
@keyframes noiseShift{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,-1px)}50%{transform:translate(1px,0)}75%{transform:translate(0,1px)}}

/* ═══════════════ 噪点纹理覆盖层 ═══════════════ */
.noise-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:noiseShift .3s steps(3) infinite}

/* ═══════════════ 涟漪效果 ═══════════════ */
.ripple-effect{position:fixed;pointer-events:none;z-index:50;width:0;height:0;border-radius:50%;background:radial-gradient(circle,rgba(240,185,88,.15) 0%,transparent 70%);animation:rippleOut .8s ease-out forwards}

/* ═══════════════ 面板拖拽 ═══════════════ */
.glass.dragging{transition:none!important;opacity:.92}
.panel-drag-handle{cursor:grab;user-select:none}
.panel-drag-handle:active{cursor:grabbing}
.glass.dragging .panel-drag-handle{cursor:grabbing}

/* ═══════════════ 画布暗角氛围 ═══════════════ */
.canvas-vignette{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(4,5,8,.35) 70%,rgba(4,5,8,.55) 100%);
  transition:opacity .8s var(--ease);
}
/* 体积光模拟 - 右上角暖光射入 */
.light-shaft{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.12;
  background:
    radial-gradient(ellipse 300px 200px at 78% 18%,rgba(255,220,180,.8) 0%,transparent 70%),
    radial-gradient(ellipse 500px 300px at 72% 22%,rgba(255,200,150,.4) 0%,transparent 60%),
    linear-gradient(105deg,transparent 40%,rgba(255,210,160,.15) 60%,rgba(255,210,160,.05) 75%,transparent 85%);
  transition:opacity .6s var(--ease);
}

/* ═══════════════ 3D 画布 ═══════════════ */
#three-canvas{position:fixed;inset:0;z-index:0;background:#06080c;transition:filter .8s var(--ease)}
#three-canvas.dimmed{filter:brightness(.55) saturate(.6)}

/* ═══════════════ 玻璃拟态面板基类 · 轻透 ═══════════════ */
.glass{
  background:oklch(14% 0.010 45/.55);
  box-shadow:
    0 0 0 1px oklch(100% 0 0/.06),
    0 0 2px 0 oklch(100% 0 0/.04) inset,
    0 4px 16px rgba(0,0,0,.35);
  border-radius:var(--radius);
  position:fixed;z-index:10;transition:all .4s var(--ease);
}
.glass::before{
  content:'';position:absolute;top:0;left:20px;right:20px;height:1px;
  background:linear-gradient(90deg,transparent,oklch(100% 0 0/.06),transparent);
  border-radius:1px;pointer-events:none;
}
.glass:hover{background:oklch(16% 0.010 45/.62);box-shadow:0 0 0 1px oklch(100% 0 0/.1),0 0 2px 0 oklch(100% 0 0/.06) inset,0 4px 20px rgba(0,0,0,.45);}

/* ═══════════════ 引擎状态 · 核心中枢 · Acrylic 质感 ═══════════════ */
.engine-core{
  position:fixed;top:44px;left:50%;z-index:5;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:opacity .6s var(--ease),transform .3s var(--ease),box-shadow .4s var(--ease);
  user-select:none;padding:4px 14px;border-radius:20px;
  /* 轻透 — 可见3D背景 */
  background:oklch(14% 0.010 45/.55);
  /* 多层阴影 */
  box-shadow:
    0 0 0 1px oklch(100% 0 0/.06),
    0 0 2px 0 oklch(100% 0 0/.04) inset,
    0 4px 16px rgba(0,0,0,.35);
}
/* 引擎后方 — 径向光源 */
.engine-core::before{
  content:'';position:fixed;top:44px;left:50%;
  width:200px;height:120px;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse 100px 60px at 50% 50%,rgba(74,222,128,.08) 0%,rgba(74,222,128,.03) 40%,transparent 70%);
  pointer-events:none;z-index:-1;border-radius:50%;
  animation:coreAura 4s ease-in-out infinite;
}
@keyframes coreAura{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.engine-core:hover{transform:translateX(-50%) scale(1.06);box-shadow:0 0 0 1px oklch(100% 0 0/.1),0 0 2px 0 oklch(100% 0 0/.06) inset,0 0 36px rgba(74,222,128,.1),0 4px 20px rgba(0,0,0,.4)}
.engine-core:active{transform:translateX(-50%) scale(.94)}
.engine-core.paused{opacity:.45}
.ec-ring-wrap{
  position:relative;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ec-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid oklch(100% 0 0/.06);
  animation:enginePulse 3s ease-in-out infinite;
}
.ec-ring-2{
  position:absolute;inset:4px;border-radius:50%;
  border:1px dashed oklch(100% 0 0/.04);
  animation:engineRingSpin 20s linear infinite;
}
.ec-ring-3{
  position:absolute;inset:8px;border-radius:50%;
  border:1px solid oklch(100% 0 0/.03);
}
.ec-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--jade);
  box-shadow:0 0 10px rgba(74,222,128,.4);
  animation:engineDotBreath 2s ease-in-out infinite;
  position:relative;z-index:1;
}
.ec-text-group{display:flex;flex-direction:column;align-items:flex-start}
.ec-label{
  font-family:var(--mono);font-size:13px;font-weight:700;
  color:var(--jade);letter-spacing:.1em;
  text-shadow:0 0 16px rgba(74,222,128,.2);line-height:1.2;
}
.ec-sub{
  font-size:10px;color:var(--text-muted);letter-spacing:.06em;
  opacity:.4;line-height:1.2;
}
.engine-core.paused .ec-label{color:var(--amber);text-shadow:0 0 24px rgba(255,168,77,.25)}
.engine-core.paused .ec-dot{background:var(--amber);animation:none;box-shadow:0 0 8px var(--amber)}
.engine-core.paused .ec-ring{border-color:oklch(100% 0 0/.04);animation:none}

/* ═══════════════ 侧边栏 · Acrylic 质感 ═══════════════ */
.sidebar{
  position:fixed;left:12px;top:50%;transform:translateY(-50%);
  z-index:20;display:flex;flex-direction:column;gap:6px;
  padding:8px 6px;border-radius:24px;
  background:oklch(14% 0.010 45/.55);
  box-shadow:
    0 0 0 1px oklch(100% 0 0/.06),
    0 0 2px 0 oklch(100% 0 0/.04) inset,
    0 4px 16px rgba(0,0,0,.35);
}
.sb-btn{width:36px;height:48px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:all .3s var(--ease);color:var(--text-muted);font-size:15px;background:transparent;border:none;position:relative}
.sb-btn:hover{color:var(--text-secondary);background:var(--bg-surface-hover)}
.sb-btn:active{transform:scale(.88)}
.sb-btn.active{color:var(--gold);background:oklch(100% 0 0/.04);box-shadow:var(--border-subtle)}
.sb-btn-label{font-size:7px;font-weight:700;letter-spacing:.12em;color:inherit;line-height:1}
.sb-logo{margin-top:4px;width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:8px;color:var(--gold);background:oklch(100% 0 0/.03);box-shadow:var(--border-subtle)}
.sb-tip{font-size:7px;color:var(--text-muted);opacity:.3;writing-mode:vertical-rl;letter-spacing:.1em;margin-top:4px}

/* ═══════════════ 状态栏 ═══════════════ */
.status-bar{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;align-items:center;gap:8px;
  padding:6px 18px;border-radius:20px;
  background:oklch(14% 0.010 45/.55);
  box-shadow:
    0 0 0 1px oklch(100% 0 0/.06),
    0 0 2px 0 oklch(100% 0 0/.04) inset,
    0 4px 16px rgba(0,0,0,.35);
  font-family:var(--mono);font-size:11px;color:var(--text-muted);
}
.status-bar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--rule);border-radius:1px}
.sb-kv{display:flex;align-items:center;gap:2px}
.sb-key{opacity:.4;font-size:10px}
.sb-val{color:var(--text-primary);font-weight:600;display:inline-block;transition:color .2s}
.sb-val.changed{color:var(--gold)}
.sb-sep{opacity:.1}

/* ═══════════════ NPC 列表面板 ═══════════════ */
.panel-npc{
  left:56px;top:60px;width:200px;max-height:calc(100vh - 170px);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-npc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;flex-shrink:0}
.panel-npc-title{font-weight:600;font-size:13px;color:var(--text-primary);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.panel-npc-title .pti{font-size:14px}
.panel-npc-add{width:26px;height:26px;border-radius:13px;border:none;background:oklch(100% 0 0/.04);color:var(--gold);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s var(--ease);box-shadow:var(--border-subtle)}
.panel-npc-add:hover{background:oklch(100% 0 0/.08);transform:scale(1.1);box-shadow:var(--border-hover)}
.panel-npc-body{flex:1;overflow-y:auto;padding:4px 8px 8px;min-height:0}
.npc-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;cursor:pointer;transition:background-color .25s var(--ease), transform .2s var(--ease);margin-bottom:2px;position:relative}
.npc-item:hover{background:var(--bg-surface-hover);transform:translateX(3px)}
.npc-item:active{transform:scale(.94)}
.npc-item.active{background:var(--bg-surface-hover);box-shadow:var(--border-hover);transform:translateX(2px)}
.npc-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.npc-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:transform .3s var(--ease)}
.npc-item.active .npc-avatar{transform:scale(1.15)}
.npc-info{flex:1;min-width:0}
.npc-name{font-weight:600;font-size:13px;color:var(--text-primary);line-height:1.2}
.npc-role{font-size:10px;color:var(--text-muted);line-height:1.2}
.npc-bottom{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:9px}
.npc-mood{font-size:13px;flex-shrink:0;line-height:1}
.npc-goal{color:var(--text-muted);font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px;opacity:.6}
.npc-status{display:flex;align-items:center;gap:1px}
.npc-status-icon{font-size:9px;opacity:.5}
.npc-status-bar{width:28px;height:3px;border-radius:1.5px;background:var(--rule);overflow:hidden}
.npc-status-fill{height:100%;border-radius:1.5px;transition:width .5s}
.npc-mood-dot{display:none}
.npc-delete{opacity:0;width:20px;height:20px;border-radius:10px;border:none;background:rgba(248,113,113,.06);color:var(--crimson);cursor:pointer;font-size:12px;transition:all .2s var(--ease);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.npc-item:hover .npc-delete{opacity:1}
.npc-delete:hover{background:rgba(248,113,113,.18);transform:scale(1.15)}

/* ═══════════════ Feed 面板 ═══════════════ */
.panel-feed{
  right:16px;top:60px;width:380px;max-height:calc(100vh - 170px);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-feed-head{display:flex;align-items:center;gap:6px;padding:12px 16px 8px;flex-shrink:0;border-bottom:1px solid var(--rule-subtle)}
.panel-feed-title{font-weight:600;font-size:13px;color:var(--text-primary);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.panel-feed-title .pti{font-size:14px}
.panel-feed-badge{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-left:auto;background:var(--rule-subtle);padding:2px 8px;border-radius:6px}
.panel-feed-body{flex:1;overflow-y:auto;padding:8px;min-height:0}
.env-inject{padding:8px 12px;margin-bottom:4px;border-radius:10px;background:oklch(22% 0.008 45/.92);box-shadow:var(--border-subtle);position:sticky;top:0;z-index:2}
.env-head{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.env-head span{font-size:10px;color:var(--text-muted);letter-spacing:.06em;font-weight:600}
.env-row{display:flex;gap:4px}
.env-input{flex:1;padding:6px 10px;background:var(--rule-subtle);border:none;border-radius:8px;color:var(--text-secondary);font-size:12px;font-family:var(--mono);outline:none;box-shadow:var(--border-hover);transition:all .2s}
.env-input:focus{box-shadow:0 0 0 1px var(--azurite),0 0 0 4px rgba(96,165,250,.06)}
.env-input::placeholder{color:var(--text-muted);opacity:.25}
.env-btn{padding:6px 12px;background:oklch(100% 0 0/.04);border:none;color:var(--azurite);border-radius:8px;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.06em;transition:all .2s var(--ease);white-space:nowrap;box-shadow:var(--border-subtle)}
.env-btn:hover{background:oklch(100% 0 0/.08);transform:translateY(-1px);box-shadow:var(--border-hover)}
.env-presets{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.env-preset{padding:3px 8px;font-size:9px;background:var(--rule-subtle);color:var(--text-muted);border-radius:6px;cursor:pointer;transition:all .2s;border:none}
.env-preset:hover{color:var(--azurite);background:oklch(100% 0 0/.04);box-shadow:var(--border-hover)}
.feed{display:flex;flex-direction:column;gap:1px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:8px;color:var(--text-muted);font-size:13px;text-align:center}
.empty-state .eicon{font-size:32px;opacity:.1;margin-bottom:4px}
.feed-line{display:flex;align-items:flex-start;gap:8px;padding:7px 12px;border-radius:10px;transition:background .2s;animation:feedSlideIn .45s var(--ease);font-size:13px;line-height:1.75;overflow:hidden}
.feed-line:hover{background:var(--rule-subtle)}
.feed-line.fi-new{animation:feedSlideIn .45s var(--ease),feedGlow 2.5s var(--ease) .15s}
.feed-line .fl-icon{width:24px;text-align:center;flex-shrink:0;font-size:16px}
.feed-line .fl-content{flex:1;min-width:0}
.feed-line .fl-time{font-family:var(--mono);font-size:10px;color:var(--text-muted);flex-shrink:0;margin-left:auto;opacity:.5}
.feed-line .fl-cause{color:var(--gold);font-weight:500}
.feed-line .fl-msg{color:var(--text-secondary)}
.feed-line .fl-whisper{color:var(--purple)}
.feed-line .fl-npc{font-weight:600;font-size:14px;letter-spacing:.02em}
.feed-line.fi-chain{background:var(--rule-subtle);border-left:2px solid var(--gold);padding-left:10px}
.feed-line .fl-arrow{color:var(--gold);opacity:.6;font-weight:700;font-size:11px}
.feed-line .fl-opinion{font-size:10px;color:var(--purple);font-style:italic;opacity:.7}

/* ═══════════════ NPC 详情面板 ═══════════════ */
.panel-detail{
  position:fixed;width:310px;max-height:420px;
  display:none;flex-direction:column;overflow:hidden;
  z-index:60;
  transform-origin:top left;
}
.panel-detail.visible{display:flex}
.panel-detail.showing{animation:panelPopIn .45s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes panelPopIn{
  0%{opacity:0;transform:scale(.3)}
  100%{opacity:1;transform:scale(1)}
}
.panel-detail-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;flex-shrink:0}
.panel-detail-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.panel-detail-name{font-weight:700;font-size:16px;color:var(--text-primary)}
.panel-detail-role{font-size:10px;color:var(--text-muted)}
.panel-detail-close{margin-left:auto;width:24px;height:24px;border-radius:12px;border:none;background:var(--bg-surface-hover);color:var(--text-muted);cursor:pointer;font-size:14px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.panel-detail-close:hover{background:var(--bg-surface-hover);color:var(--text-primary)}
.panel-detail-body{flex:1;overflow-y:auto;padding:4px 16px 14px;min-height:0}
.detail-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.detail-label{width:30px;font-size:9px;color:var(--text-muted);text-align:right;font-weight:600;flex-shrink:0}
.detail-track{flex:1;height:5px;background:var(--rule);border-radius:2px;cursor:pointer;position:relative}
.detail-fill{height:100%;border-radius:2px;transition:width .15s}
.detail-thumb{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);cursor:grab;box-shadow:0 0 6px rgba(0,0,0,.5);transition:left .15s,box-shadow .2s,transform .2s}
.detail-thumb:hover{box-shadow:var(--border-hover);transform:translate(-50%,-50%) scale(1.4)}
.detail-thumb:active{cursor:grabbing}
.detail-val{width:24px;font-size:10px;color:var(--text-muted);font-family:var(--mono);text-align:center}
.detail-section{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule-subtle)}
.detail-section-title{font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:.04em;margin-bottom:8px}
.detail-rels{display:flex;flex-direction:column;gap:3px}
.detail-rel-row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;background:var(--rule-subtle);transition:background .2s;cursor:pointer}
.detail-rel-row:hover{background:var(--bg-surface-hover)}
.detail-rel-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.detail-rel-name{font-size:11px;font-weight:600;color:var(--text-primary);min-width:36px;flex-shrink:0}
.detail-rel-bar{flex:1;height:4px;background:var(--rule);border-radius:2px;position:relative;overflow:hidden}
.detail-rel-fill{height:100%;border-radius:2px;transition:width .3s}
.detail-rel-val{font-size:9px;font-weight:700;color:var(--text-secondary);width:20px;text-align:right;flex-shrink:0}
.detail-rel-tag{font-size:8px;color:var(--text-muted);opacity:.5;flex-shrink:0;min-width:28px}
.opinion-row{display:flex;align-items:flex-start;gap:4px;padding:2px 0;font-size:10px;border-bottom:1px solid var(--rule-subtle)}
.opinion-stance{font-size:12px;flex-shrink:0;width:16px;text-align:center}
.opinion-text{color:var(--text-primary);flex:1;line-height:1.3}
.opinion-subject{color:var(--text-muted);font-size:8px;opacity:.4;flex-shrink:0;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 情绪历史 */
.detail-mood-history{margin-top:6px}
.mood-row{display:flex;align-items:center;gap:4px;padding:2px 0;font-size:9px;border-bottom:1px solid var(--rule-subtle)}
.mood-emoji{font-size:10px;flex-shrink:0}
.mood-text{color:var(--text-muted);flex-shrink:0;min-width:36px}
.mood-cause{color:var(--text-muted);opacity:.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whisper-row{display:flex;gap:4px}
.whisper-input{flex:1;padding:6px 10px;background:var(--rule-subtle);border:none;border-radius:8px;color:var(--text-secondary);font-size:12px;font-family:var(--mono);outline:none;box-shadow:var(--border-hover);transition:all .2s}
.whisper-input:focus{box-shadow:0 0 0 1px var(--purple),0 0 0 4px rgba(192,132,252,.06)}
.whisper-input::placeholder{color:var(--text-muted);opacity:.25}
.whisper-btn{padding:6px 10px;background:oklch(100% 0 0/.04);border:none;color:var(--purple);border-radius:8px;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.06em;transition:all .2s var(--ease);white-space:nowrap;box-shadow:var(--border-subtle)}
.whisper-btn:hover{background:oklch(100% 0 0/.08);transform:translateY(-1px);box-shadow:var(--border-hover)}

/* ═══════════════ NPC 创建面板 ═══════════════ */
.panel-create{
  right:0;top:0;bottom:0;width:380px;
  transform:translateX(100%);display:flex;flex-direction:column;
  border-radius:var(--radius) 0 0 var(--radius);
  transition:transform .5s var(--ease);
  z-index:30;
}
.panel-create.open{transform:translateX(0)}
.panel-create-backdrop{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .4s}
.panel-create-backdrop.open{opacity:1;pointer-events:auto}
.panel-create-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;flex-shrink:0}
.panel-create-title{font-weight:700;font-size:15px;color:var(--text-primary);letter-spacing:-.01em}
.panel-create-close{width:28px;height:28px;border-radius:14px;border:none;background:var(--bg-surface-hover);color:var(--text-muted);cursor:pointer;font-size:14px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.panel-create-close:hover{background:var(--bg-surface-hover);color:var(--text-primary)}
.panel-create-body{flex:1;overflow-y:auto;padding:4px 20px 16px;min-height:0}
.create-field{margin-bottom:14px}
.create-label{font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:.04em;margin-bottom:5px;display:block}
.create-input{padding:8px 12px;background:var(--rule-subtle);border:none;border-radius:10px;color:var(--text-primary);font-size:13px;width:100%;outline:none;box-shadow:var(--border-hover);transition:all .2s;font-family:inherit}
.create-input:focus{box-shadow:0 0 0 1px var(--gold),0 0 0 4px rgba(240,185,88,.06)}
.create-input::placeholder{color:var(--text-muted);opacity:.25}
.create-row{display:flex;gap:8px}
.create-row .create-field{flex:1;margin-bottom:0}
.create-select-wrap{position:relative;overflow:visible;z-index:1}
.create-select{appearance:none;padding:8px 32px 8px 12px;background:var(--rule-subtle);border:none;border-radius:10px;color:var(--text-primary);font-size:13px;width:100%;outline:none;cursor:pointer;box-shadow:var(--border-hover);transition:all .2s;font-family:inherit;position:relative}
.create-select:focus{box-shadow:0 0 0 1px var(--gold),0 0 0 4px rgba(240,185,88,.06)}
.create-select-wrap::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:10px;pointer-events:none;transition:color .2s}
.create-select-wrap:focus-within::after{color:var(--gold)}
option{background:#1a1a2e;color:#e0e0e0}
.create-color{width:100%;height:36px;border:none;border-radius:10px;cursor:pointer;background:transparent;padding:2px}
.create-traits{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.create-trait{display:flex;align-items:center;gap:4px}
.create-presets{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.preset-btn{font-size:9px;padding:3px 8px;border-radius:6px;border:1px solid var(--rule);background:var(--rule-subtle);color:var(--text-muted);cursor:pointer;transition:all .2s;font-family:inherit}
.preset-btn:hover{background:oklch(100% 0 0/.06);border-color:var(--rule);color:var(--gold)}
.preset-btn:active{transform:scale(.94)}
.create-trait label{font-size:10px;color:var(--text-muted);width:30px;text-align:right;font-weight:600}
.create-trait input[type=range]{flex:1;height:3px;appearance:none;background:var(--rule);border-radius:2px;outline:none}
.create-trait input[type=range]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:var(--border-subtle)}
.create-trait .mt-val{font-family:var(--mono);font-size:10px;width:24px;text-align:center;color:var(--text-muted)}
.create-preview{display:flex;align-items:center;gap:10px;padding:12px;margin:12px 0;border-radius:10px;background:var(--rule-subtle);box-shadow:var(--border-subtle)}
.create-preview-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.create-preview-info{font-size:11px;color:var(--text-muted)}
/* v5.3 故事背景分析 */
.create-story{width:100%;min-height:72px;padding:10px 12px;background:var(--rule-subtle);border:none;border-radius:10px;color:var(--text-secondary);font-size:12px;font-family:var(--sans);outline:none;resize:vertical;box-shadow:var(--border-hover);transition:all .2s;line-height:1.6}
.create-story:focus{box-shadow:0 0 0 1px var(--gold),0 0 0 4px rgba(240,185,88,.06)}
.create-story::placeholder{color:var(--text-muted);opacity:.25}
.btn-analyze{font-size:10px;padding:5px 12px;border-radius:8px;border:1px solid var(--gold);background:rgba(240,185,88,.06);color:var(--gold);cursor:pointer;transition:all .2s;font-family:inherit;font-weight:600;letter-spacing:.02em}
.btn-analyze:hover{background:rgba(240,185,88,.14);transform:translateY(-1px)}
.btn-analyze:active{transform:scale(.94)}
.analyze-result{font-size:10px;color:var(--text-muted);margin-top:4px;padding:4px 0;min-height:16px;transition:all .3s}
.analyze-result .ar-hit{color:var(--gold);font-weight:600}
.create-preview-info strong{color:var(--text-primary);font-size:13px}
.create-actions{display:flex;gap:8px;padding:12px 20px;flex-shrink:0;border-top:1px solid var(--rule-subtle)}
.create-actions button{padding:10px 20px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s var(--ease);border:none;flex:1}
.btn-cancel{background:var(--bg-surface-hover);color:var(--text-muted)}
.btn-cancel:hover{background:var(--rule);color:var(--text-secondary)}
.btn-birth{background:var(--gold);color:#1a1a1a;box-shadow:var(--border-subtle)}
.btn-birth:hover{background:#f5c870;box-shadow:var(--border-hover);transform:translateY(-1px)}
.btn-random{background:oklch(100% 0 0/.04);color:var(--purple);box-shadow:var(--border-subtle)}
.btn-random:hover{background:oklch(100% 0 0/.08)}

/* ═══════════════ 沙盒面板 ═══════════════ */
.panel-sandbox{
  right:16px;top:60px;width:380px;max-height:calc(100vh - 170px);
  display:none;flex-direction:column;overflow:hidden;
}
.panel-sandbox.visible{display:flex}
.panel-sandbox-head{display:flex;align-items:center;gap:6px;padding:12px 16px 8px;flex-shrink:0;border-bottom:1px solid var(--rule-subtle)}
.panel-sandbox-title{font-weight:600;font-size:13px;color:var(--text-primary);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.panel-sandbox-title .pti{font-size:14px}
.panel-sandbox-body{flex:1;overflow-y:auto;padding:10px;min-height:0}
.sb-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.sb-stat-card{padding:12px;border-radius:10px;background:var(--rule-subtle);box-shadow:var(--border-subtle);transition:all .3s var(--ease)}
.sb-stat-card:hover{background:var(--rule);transform:translateY(-1px)}
.sb-stat-label{font-size:9px;color:var(--text-muted);letter-spacing:.1em;font-weight:700;margin-bottom:4px;text-transform:uppercase}
.sb-stat-val{font-size:30px;font-weight:700;color:var(--text-primary);line-height:1;transition:color .3s}
.sb-stat-val.changed{color:var(--gold)}
.sb-stat-meta{font-size:9px;color:var(--text-muted);margin-top:2px}
.sb-matrix-section{margin-top:4px}
.sb-matrix-title{font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.sb-matrix-scroll{max-height:240px;overflow:auto;border-radius:8px}
.sb-matrix-grid{display:grid;gap:1px}
.sb-matrix-cell{border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;min-height:28px;min-width:34px;padding:0 2px;transition:transform .2s var(--ease-bounce);position:relative}
.sb-matrix-cell.header{font-size:8px;cursor:default;font-weight:600;min-height:22px;color:var(--text-muted)}
.sb-matrix-cell.diag{background:var(--rule-subtle);color:var(--text-muted);cursor:default;font-size:11px}
.sb-matrix-cell.data:hover{transform:scale(1.3);z-index:5;box-shadow:var(--border-hover)}
/* .sb-matrix-cell.data.flash removed — 消除闪烁 */
.sb-matrix-scale{display:flex;align-items:center;gap:5px;font-size:8px;color:var(--text-muted);padding:3px 0}
.sb-scale-bar{flex:1;height:2px;border-radius:1px;background:linear-gradient(90deg,var(--crimson),var(--amber),var(--gold),var(--jade),#22c55e)}

/* ═══════════════ 引擎控制栏 ═══════════════ */
.engine-bar{
  bottom:14px;right:16px;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:6px 14px;border-radius:20px;
  box-shadow:var(--border-subtle);
}
.ep-group{display:flex;align-items:center;gap:4px}
.ep-label{font-size:8px;color:var(--text-muted);letter-spacing:.12em;width:30px;font-weight:700}
.ep-slider{width:64px;height:8px;padding:4px 0;background:var(--rule);border-radius:4px;appearance:none;outline:none;cursor:pointer;pointer-events:auto}
.ep-slider::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:var(--border-subtle);transition:transform .2s}
.ep-slider::-webkit-slider-thumb:hover{transform:scale(1.5)}
.ep-val{font-family:var(--mono);font-size:11px;color:var(--gold);font-weight:700;min-width:22px;text-align:center}
.ep-sep{width:1px;height:12px;background:var(--rule)}
.ep-btn{padding:6px 14px;font-size:9px;font-weight:700;background:oklch(100% 0 0/.04);border:none;color:var(--jade);border-radius:12px;cursor:pointer;letter-spacing:.08em;transition:all .2s var(--ease);white-space:nowrap;box-shadow:var(--border-subtle)}
.ep-btn:hover{background:oklch(100% 0 0/.08);transform:translateY(-1px);box-shadow:var(--border-hover)}
.ep-btn.paused{background:oklch(100% 0 0/.04);color:var(--amber);box-shadow:var(--border-subtle)}
.ep-status{font-size:9px;color:var(--text-muted);letter-spacing:.1em;display:flex;align-items:center;gap:3px}
.ep-dot{width:3px;height:3px;border-radius:50%;background:var(--jade);animation:dotPulse 2s infinite}
.ep-status.paused .ep-dot{background:var(--amber)}

/* ═══════════════ 面板暂停覆盖层 ═══════════════ */
.panel-overlay{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.65);border-radius:var(--radius);
  opacity:0;pointer-events:none;transition:opacity .5s var(--ease);
}
.panel-overlay.visible{opacity:1;pointer-events:auto}
.panel-overlay-text{font-family:var(--mono);font-size:14px;color:var(--amber);letter-spacing:.1em;font-weight:700;text-shadow:0 0 16px rgba(255,168,77,.3)}

/* ═══════════════ 场景图例标签 ═══════════════ */
.scene-legend{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  z-index:6;display:flex;gap:20px;transition:opacity .5s var(--ease);
  font-size:9px;color:var(--text-muted);letter-spacing:.06em;
}
.scene-legend.fading{opacity:.15}
.legend-item{display:flex;align-items:center;gap:5px;transition:color .3s}
.legend-item:hover{color:var(--text-secondary)}
.legend-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.legend-dot.ring{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.legend-dot.npc{background:var(--jade);box-shadow:0 0 6px var(--jade)}
.legend-dot.particle{background:var(--text-muted);animation:dotPulse 2s infinite}

/* ═══════════════ 迷你沙盒指示器 ═══════════════ */
.mini-sandbox{
  position:fixed;bottom:68px;left:50%;transform:translateX(-50%);
  z-index:6;display:flex;align-items:center;gap:8px;
  padding:4px 12px;border-radius:12px;
  background:oklch(22% 0.010 45/.88);
  box-shadow:var(--border-subtle),0 4px 16px rgba(0,0,0,.35);
  font-family:var(--mono);font-size:9px;color:var(--text-muted);
  transition:all .4s var(--ease);letter-spacing:.04em;
}
.mini-sandbox:hover{background:var(--bg-surface-hover);color:var(--text-secondary)}
.mini-sb-item{display:flex;align-items:center;gap:2px}
.mini-sb-val{color:var(--gold);font-weight:600}
.showcase-btn{background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(239,68,68,.15));border:1px solid rgba(245,158,11,.3);color:#f5a623;font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:6px;cursor:pointer;transition:all .3s;letter-spacing:.04em}
.showcase-btn:hover{background:linear-gradient(135deg,rgba(245,158,11,.35),rgba(239,68,68,.25));border-color:rgba(245,158,11,.6);box-shadow:0 0 12px rgba(245,158,11,.2)}
.showcase-btn.running{animation:showcasePulse .8s infinite;pointer-events:none;opacity:.6}
@keyframes showcasePulse{0%,100%{box-shadow:0 0 4px rgba(245,158,11,.1)}50%{box-shadow:0 0 16px rgba(245,158,11,.4)}}
.mini-sb-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.mini-sb-dot.active{background:var(--jade);animation:dotPulse 2s infinite}
.mini-sb-dot.idle{background:var(--text-muted)}
/* .mini-sb-pulse removed — 消除闪烁 */

/* ═══════════════ 3D NPC 悬浮标签 ═══════════════ */
.npc-hover-label{
  position:fixed;pointer-events:none;z-index:50;
  padding:6px 14px;border-radius:10px;
  background:oklch(26% 0.010 45/.92);
  box-shadow:var(--border-hover),0 4px 20px rgba(0,0,0,.6);
  font-size:12px;color:var(--text-primary);font-weight:600;
  opacity:0;transition:opacity .12s;transform:translate(-50%,-140%);
  white-space:nowrap;
}
.npc-hover-label.visible{opacity:1}

/* NPC 3D 常驻标签 */
.npc-3d-label{
  position:fixed;z-index:4;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-100%);
  font-family:var(--mono);transition:opacity .5s var(--ease);
}
.npc-3d-label .nl-name{
  font-size:10px;font-weight:600;color:var(--text-primary);
  letter-spacing:.04em;text-shadow:0 0 8px rgba(0,0,0,.8);
  margin-bottom:1px;
}
.npc-3d-label .nl-info{
  font-size:8px;color:var(--text-muted);opacity:.7;
  letter-spacing:.03em;text-shadow:0 0 4px rgba(0,0,0,.6);
  max-width:110px;text-align:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.npc-3d-label .nl-dot{
  width:5px;height:5px;border-radius:50%;margin-bottom:3px;
  box-shadow:0 0 6px currentColor;
}

/* 关系线标签 */
.rel-label{
  position:fixed;z-index:3;pointer-events:none;
  font-family:var(--mono);font-size:8px;color:var(--text-muted);
  opacity:0;transition:opacity .3s;transform:translate(-50%,-50%);
  text-shadow:0 0 4px rgba(0,0,0,.8);
}
.rel-label.visible{opacity:.5}

/* ═══════════════ 对话面板 ═══════════════ */
.panel-dialogue{
  left:56px;bottom:60px;width:320px;max-height:420px;
  display:none;flex-direction:column;overflow:hidden;
  animation:panelIn .4s var(--ease);
}
.panel-dialogue.visible{display:flex}
.panel-dialogue-head{display:flex;align-items:center;gap:6px;padding:12px 16px 8px;flex-shrink:0;border-bottom:1px solid var(--rule-subtle)}
.panel-dialogue-title{font-weight:600;font-size:13px;color:var(--text-primary);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.panel-dialogue-title .pti{font-size:14px}
.panel-dialogue-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.dialogue-sep{display:flex;align-items:center;gap:6px;padding:8px 0;margin:4px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ds-dot{font-size:6px;color:var(--gold);opacity:.5;flex-shrink:0}
.ds-text{font-size:9px;color:var(--text-muted);opacity:.5;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dialogue-bubble{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .4s var(--ease);padding:4px 0}
.dialogue-bubble .db-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.dialogue-bubble .db-body{flex:1;min-width:0}
.dialogue-bubble .db-name{font-size:10px;font-weight:600;letter-spacing:.04em;margin-bottom:2px;line-height:1}
.dialogue-bubble .db-text{font-size:12px;color:var(--text-secondary);line-height:1.6;padding:6px 10px;border-radius:0 10px 10px 10px;background:var(--rule);box-shadow:var(--border-subtle)}
.dialogue-bubble .db-time{font-family:var(--mono);font-size:8px;color:var(--text-muted);margin-top:3px;opacity:.4}
/* 内心独白：紫色斜体，半透明，区别于对话 */
.dialogue-inner{opacity:.75}
.dialogue-inner .db-avatar{opacity:.6}
.dialogue-inner .db-text{background:rgba(167,139,250,.06);box-shadow:0 0 0 1px rgba(167,139,250,.1);font-style:italic;color:#a78bfa}
.dialogue-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:6px;color:var(--text-muted);font-size:12px;text-align:center;flex:1}
.dialogue-empty .deicon{font-size:24px;opacity:.1;margin-bottom:2px}
.panel-dialogue .panel-overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);border-radius:var(--radius);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.panel-dialogue .panel-overlay.visible{opacity:1;pointer-events:auto}

/* ═══════════════ Agent 对话推理面板 ═══════════════ */
.panel-agent{
  left:56px;bottom:60px;width:400px;max-height:calc(100vh - 170px);
  display:none;flex-direction:column;overflow:hidden;animation:panelIn .4s var(--ease);
}
.panel-agent.visible{display:flex}
.panel-agent-head{display:flex;align-items:center;gap:6px;padding:12px 16px 8px;flex-shrink:0;border-bottom:1px solid var(--rule-subtle)}
.panel-agent-title{font-weight:600;font-size:13px;color:var(--text-primary);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.panel-agent-title .pti{font-size:14px}
.panel-agent-body{flex:1;overflow-y:auto;padding:8px;min-height:0}
.agent-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:6px;color:var(--text-muted);font-size:12px;text-align:center;flex:1}
.agent-empty .deicon{font-size:24px;opacity:.1;margin-bottom:2px}
.agent-step{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--rule-subtle);border-left:2px solid var(--jade);animation:fadeUp .3s var(--ease)}
.agent-step.system{border-left-color:var(--purple)}
.agent-step.tool{border-left-color:var(--amber)}
.agent-step.reflex{border-left-color:var(--crimson)}
.agent-step.decision{border-left-color:var(--gold)}
.agent-step-label{font-size:9px;font-weight:700;letter-spacing:.1em;margin-bottom:3px}
.agent-step-label.sys{color:var(--purple)}
.agent-step-label.tool{color:var(--amber)}
.agent-step-label.reflex{color:var(--crimson)}
.agent-step-label.decision{color:var(--gold)}
.agent-step-label.percept{color:var(--jade)}
.agent-step-text{font-size:11px;color:var(--text-secondary);line-height:1.5}
.agent-step-meta{font-family:var(--mono);font-size:9px;color:var(--text-muted);margin-top:3px}
.agent-kv{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.agent-kv-item{font-size:9px;padding:2px 6px;border-radius:4px;background:oklch(100% 0 0/.04);color:var(--text-muted);font-family:var(--mono)}
.agent-kv-key{color:var(--jade)}

/* ═══════════════ Pipeline 编排面板 ═══════════════ */
.panel-pipeline{
  right:16px;bottom:60px;width:440px;max-height:calc(100vh - 170px);
  display:none;flex-direction:column;overflow:hidden;animation:panelIn .4s var(--ease);
}
.panel-pipeline.visible{display:flex}
.panel-pipeline-head{display:flex;align-items:center;gap:6px;padding:12px 16px 8px;flex-shrink:0;border-bottom:1px solid var(--rule-subtle)}
.panel-pipeline-title{font-weight:600;font-size:13px;color:var(--text-primary);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.panel-pipeline-title .pti{font-size:14px}
.panel-pipeline-body{flex:1;overflow-y:auto;padding:10px;min-height:0}
.pipeline-layers{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.pl-layer{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--rule-subtle);border:1px solid transparent;transition:all .3s var(--ease)}
.pl-layer.active{border-color:var(--jade);background:rgba(34,197,94,.04)}
.pl-layer.processing{border-color:var(--amber);background:rgba(245,158,11,.04);animation:layerPulse 1s infinite}
.pl-layer.done{border-color:var(--jade);opacity:.6}
@keyframes layerPulse{0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 8px rgba(245,158,11,.15)}}
.pl-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:700;flex-shrink:0;background:var(--rule);color:var(--text-muted)}
.pl-layer.active .pl-num{background:var(--jade);color:#1a1a1a}
.pl-layer.processing .pl-num{background:var(--amber);color:#1a1a1a}
.pl-info{flex:1;min-width:0}
.pl-name{font-size:11px;font-weight:600;color:var(--text-primary);letter-spacing:.04em}
.pl-desc{font-size:9px;color:var(--text-muted);margin-top:1px}
.pl-status{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:4px;background:oklch(100% 0 0/.04);color:var(--text-muted);white-space:nowrap}
.pl-layer.active .pl-status{background:rgba(34,197,94,.1);color:var(--jade)}
.pl-layer.processing .pl-status{background:rgba(245,158,11,.1);color:var(--amber);animation:dotPulse 1s infinite}
.pl-arrow{text-align:center;color:var(--text-muted);font-size:10px;opacity:.3;padding:1px 0}
.pipeline-log-section{border-top:1px solid var(--rule-subtle);padding-top:10px}
.pipeline-log-title{font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;margin-bottom:6px}
.pipeline-log{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.pl-entry{font-family:var(--mono);font-size:9px;padding:3px 6px;border-radius:4px;background:oklch(100% 0 0/.02);color:var(--text-muted);line-height:1.4;animation:fadeUp .2s var(--ease)}
.pl-entry.percept{color:var(--jade)}
.pl-entry.semantic{color:var(--blue)}
.pl-entry.memory{color:var(--purple)}
.pl-entry.mood{color:var(--amber)}
.pl-entry.decision{color:var(--gold)}
.pl-entry.behavior{color:var(--teal)}
.pl-entry.chain{color:var(--crimson)}
.panel-agent .panel-overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);border-radius:var(--radius);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.panel-agent .panel-overlay.visible{opacity:1;pointer-events:auto}
.panel-pipeline .panel-overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);border-radius:var(--radius);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
.panel-pipeline .panel-overlay.visible{opacity:1;pointer-events:auto}
</head>
<body>
<canvas id="three-canvas"></canvas>
<div class="canvas-vignette"></div>
<div class="light-shaft"></div>

<!-- 侧边栏 -->

  <span class="sb-tip">灵 魂 工 坊</span>
</div>

<!-- 场景图例 -->
<div class="scene-legend" id="scene-legend">

  <div class="legend-item"><span class="legend-dot npc"></span>意识体球</div>
  <div class="legend-item"><span class="legend-dot particle"></span>意识粒子</div>
  <div class="legend-item" style="opacity:.5">点击球体 → 选中NPC</div>
</div>

<!-- 迷你沙盒指示器 -->
<div class="mini-sandbox" id="mini-sandbox">
  <div class="mini-sb-item"><span class="mini-sb-dot active" id="msb-dot"></span>引擎</div>
  <span style="opacity:.2">|</span>
  <div class="mini-sb-item">事件 <span class="mini-sb-val" id="msb-events">0</span></div>
  <span style="opacity:.2">|</span>
  <div class="mini-sb-item">活跃 <span class="mini-sb-val" id="msb-active">5</span></div>
  <span style="opacity:.2">|</span>
  <div class="mini-sb-item">延迟 <span class="mini-sb-val" id="msb-latency" style="color:#4ade80">0ms</span></div>
  <span style="opacity:.2">|</span>
  <div class="mini-sb-item">关系Δ <span class="mini-sb-val" id="msb-rel">0</span></div>
  <span style="opacity:.2">|</span>
  <button class="showcase-btn" onclick="runShowcase()" title="一键黄金三分钟演示">🎬 演示</button>
</div>

<!-- 状态栏 -->
<div class="status-bar">
  <span class="sb-kv"><span class="sb-key">TICK</span><span class="sb-val" id="sb-tick">0</span></span>
  <span class="sb-sep">|</span><span class="sb-kv"><span class="sb-key">NPC</span><span class="sb-val" id="sb-active">5</span></span>
  <span class="sb-sep">|</span><span class="sb-kv"><span class="sb-key">T°</span><span class="sb-val" id="sb-temp">35</span></span>
  <span class="sb-sep">|</span><span class="sb-kv"><span class="sb-key">CHAOS</span><span class="sb-val" id="sb-chaos">50</span></span>
  <span class="sb-sep">|</span><span class="sb-kv"><span class="sb-key">EVT</span><span class="sb-val" id="sb-events">0</span></span>
  <span class="sb-sep">|</span><span class="sb-kv"><span class="sb-key">LAT</span><span class="sb-val" id="sb-latency" style="color:#4ade80">0ms</span></span>
  <span class="sb-sep">|</span><span class="sb-kv"><span class="sb-key">MEM</span><span class="sb-val" id="sb-mem" style="color:#60a5fa">--</span></span>
  <span class="sb-sep">|</span><span class="sb-kv"><span class="sb-key" id="sb-time-label" style="color:#f0b958">--</span><span class="sb-val" id="sb-time" style="color:#f0b958">--</span></span>
</div>

<!-- NPC 列表面板 -->
<div class="glass panel-npc">
  <div class="panel-npc-head panel-drag-handle" data-drag-handle>
    <span class="panel-npc-title"><span class="pti">⬡</span>意识体</span>
    <button class="panel-npc-add" onclick="openCreatePanel()" title="孕育新意识体">+</button>
  </div>
  <div class="panel-npc-body" id="npc-list"></div>
  <div class="panel-overlay" id="npc-overlay"><span class="panel-overlay-text">⏸ 引擎暂停</span></div>
</div>

<!-- Feed 面板 -->
<div class="glass panel-feed" id="feed-panel">
  <div class="panel-feed-head panel-drag-handle" data-drag-handle>
    <span class="panel-feed-title"><span class="pti">◈</span>村落纪事</span>
    <span class="panel-feed-badge" id="act-count">0</span>
  </div>
  <div class="panel-feed-body">
    <div class="env-inject">
      <div class="env-head"><span>🌐 环境注入</span><span style="font-size:7px;opacity:.3">描述场景，NPC自主反应</span></div>
      <div class="env-row"><input type="text" class="env-input" id="env-input" placeholder="村口来了个陌生人 / 雨夜传来怪声..." maxlength="60"><button class="env-btn" onclick="injectEnvironment()">注入</button></div>
      <div class="env-presets">
        <button class="env-preset" onclick="quickInject('村口来了个浑身是血的陌生人')">陌生来客</button>
        <button class="env-preset" onclick="quickInject('夜里井边传来奇怪声响')">夜半异响</button>
        <button class="env-preset" onclick="quickInject('集市上有人丢了钱袋')">集市失窃</button>
        <button class="env-preset" onclick="quickInject('远山起了大火')">远山大火</button>
        <button class="env-preset" onclick="quickInject('有商人路过村庄')">商队路过</button>
        <button class="env-preset" onclick="quickInject('祠堂前的古碑裂开了')">古碑裂痕</button>
      </div>
    </div>
    <div class="feed" id="feed"><div class="empty-state"><div class="eicon">◈</div><div>意识引擎运行中 · NPC将自主产生行动</div><div style="font-size:9px;opacity:.4;line-height:1.8">🖱 点击中心引擎 → 启停系统<br>🖱 点击3D球体 → 选中NPC<br>🖱 拖拽性格滑块 → 改变NPC行为<br>🖱 环境注入 → NPC自主反应</div></div></div>
  </div>
  <div class="panel-overlay" id="feed-overlay"><span class="panel-overlay-text">⏸ 引擎暂停</span></div>
</div>

<!-- 沙盒面板 -->
<div class="glass panel-sandbox" id="sandbox-panel">
  <div class="panel-sandbox-head panel-drag-handle" data-drag-handle>
    <span class="panel-sandbox-title"><span class="pti">◆</span>沙盒诊断</span>
    <span class="panel-feed-badge" id="sb-badge">实时</span>
  </div>
  <div class="panel-sandbox-body">
    <div class="sb-stats">
      <div class="sb-stat-card"><div class="sb-stat-label">涌现事件</div><div class="sb-stat-val" id="sb-total">0</div><div class="sb-stat-meta">引擎累计产生</div></div>
      <div class="sb-stat-card"><div class="sb-stat-label">连锁反应</div><div class="sb-stat-val" id="sb-chains">0</div><div class="sb-stat-meta">NPC自主触发</div></div>
      <div class="sb-stat-card"><div class="sb-stat-label">关系变化</div><div class="sb-stat-val" id="sb-relchg">0</div><div class="sb-stat-meta">信任度波动</div></div>
      <div class="sb-stat-card"><div class="sb-stat-label">活跃NPC</div><div class="sb-stat-val" id="sb-active-sb">5</div><div class="sb-stat-meta">当前在线</div></div>
    </div>
    <div class="sb-matrix-section">
      <div class="sb-matrix-title">📊 关系矩阵实时快照<span style="font-size:7px;opacity:.4;font-weight:400">颜色越绿=信任度越高</span></div>
      <div class="sb-matrix-scroll"><div class="sb-matrix-grid" id="sb-matrix-grid"></div></div>
      <div class="sb-matrix-scale"><span>0</span><div class="sb-scale-bar"></div><span>100</span></div>
    </div>
  </div>
  <div class="panel-overlay" id="sb-overlay"><span class="panel-overlay-text">⏸ 引擎暂停</span></div>
</div>

<!-- NPC 对话面板 -->
<div class="glass panel-dialogue" id="dialogue-panel">
  <div class="panel-dialogue-head panel-drag-handle" data-drag-handle>
    <span class="panel-dialogue-title"><span class="pti">💬</span>NPC 对话</span>
    <span class="panel-feed-badge" id="dlg-badge">实时</span>
  </div>
  <div class="panel-dialogue-body" id="dialogue-body">
    <div class="dialogue-empty"><span class="deicon">💬</span>引擎启动后，NPC 对话将在此浮现</div>
  </div>
  <div class="panel-overlay" id="dlg-overlay"><span class="panel-overlay-text">⏸ 引擎暂停</span></div>
</div>

<!-- AI Agent 对话推理面板 -->
<div class="glass panel-agent" id="agent-panel">
  <div class="panel-agent-head panel-drag-handle" data-drag-handle>
    <span class="panel-agent-title"><span class="pti">🤖</span>AI Agent · 推理可视化</span>
    <span class="panel-feed-badge" id="agent-badge">SIM</span>
  </div>
  <div class="panel-agent-body" id="agent-body">
    <div class="agent-empty"><span class="deicon">🤖</span>事件触发后，Agent 推理链将在此展示</div>
  </div>
  <div class="panel-overlay" id="agent-overlay"><span class="panel-overlay-text">⏸ 引擎暂停</span></div>
</div>

<!-- Pipeline 编排面板 -->
<div class="glass panel-pipeline" id="pipeline-panel">
  <div class="panel-pipeline-head panel-drag-handle" data-drag-handle>
    <span class="panel-pipeline-title"><span class="pti">⚙</span>Agent Pipeline · 工作流编排</span>
    <span class="panel-feed-badge" id="pipeline-badge">6层</span>
  </div>
  <div class="panel-pipeline-body" id="pipeline-body">
    <div class="pipeline-layers" id="pipeline-layers"></div>
    <div class="pipeline-log-section">
      <div class="pipeline-log-title">📋 推理日志</div>
      <div class="pipeline-log" id="pipeline-log"></div>
    </div>
  </div>
  <div class="panel-overlay" id="pipeline-overlay"><span class="panel-overlay-text">⏸ 引擎暂停</span></div>
</div>

<!-- NPC 详情面板 -->
<div class="glass panel-detail" id="detail-panel">
  <div class="panel-detail-head panel-drag-handle" data-drag-handle>
    <div class="panel-detail-avatar" id="detail-avatar" style="background:rgba(96,165,250,.1);color:#60a5fa">⚔</div>
    <div>
      <div class="panel-detail-name" id="detail-name">云溪</div>
      <div class="panel-detail-role" id="detail-role">侠客</div>
    </div>
    <button class="panel-detail-close" onclick="hideDetail()">✕</button>
  </div>
  <div class="panel-detail-body">
    <div id="detail-traits"></div>
    <div class="detail-section">
      <div class="detail-section-title">🕸 与其他意识体的关系</div>
      <div class="detail-rels" id="detail-rels"></div>
      <div class="detail-ops" id="detail-ops"></div>
      <div class="detail-mood-history" id="detail-mood-history"></div>
    </div>

        <input type="text" class="whisper-input" id="whisper-input" placeholder="悄声说点什么..." maxlength="40" onkeydown="if(event.key==='Enter')whisper()">
        <button class="whisper-btn" onclick="whisper()">低语</button>
      </div>
    </div>
  </div>
</div>

<!-- NPC 创建面板 -->
<div class="panel-create-backdrop" id="create-backdrop" onclick="closeCreatePanel()"></div>
<div class="glass panel-create" id="create-panel">
  <div class="panel-create-head">
    <span class="panel-create-title">✦ 孕育新意识体</span>
    <button class="panel-create-close" onclick="closeCreatePanel()">✕</button>
  </div>
  <div class="panel-create-body">
    <div class="create-field"><label class="create-label">名称</label><input type="text" class="create-input" id="c-name" placeholder="新角色名字" maxlength="6" oninput="updateCreatePreview()"></div>
    <div class="create-row">
      <div class="create-field"><label class="create-label">身份</label><input type="text" class="create-input" id="c-role" list="role-presets" placeholder="输入或选择…" maxlength="6" oninput="updateCreatePreview()"><datalist id="role-presets"><option value="猎户"><option value="铁匠"><option value="书生"><option value="侠客"><option value="村民"><option value="郎中"><option value="厨子"><option value="渔夫"><option value="樵夫"><option value="商贩"><option value="酒鬼"><option value="乞丐"><option value="更夫"><option value="货郎"><option value="屠户"><option value="绣娘"><option value="画师"><option value="琴师"><option value="说书"><option value="道士"></datalist></div>
      <div class="create-field"><label class="create-label">头像</label><div class="create-select-wrap"><input type="text" class="create-select" id="c-avatar" list="avatar-presets" placeholder="🗡" maxlength="2" oninput="updateCreatePreview()"><datalist id="avatar-presets"><option value="🗡"><option value="🛡"><option value="🏹"><option value="🧙"><option value="🕯"><option value="🐺"><option value="🦊"><option value="🐴"><option value="⚒"><option value="🐟"><option value="🍺"><option value="🎭"><option value="🌿"><option value="🎪"><option value="⚡"><option value="⚔"><option value="🪓"><option value="🔥"><option value="💧"><option value="🌙"></datalist></div></div>
    </div>
    <div class="create-row">
      <div class="create-field"><label class="create-label">色调</label><input type="color" class="create-color" id="c-color" value="#60a5fa" oninput="updateCreatePreview()"></div>
      <div class="create-field"><label class="create-label">说话风格</label><div class="create-select-wrap"><input type="text" class="create-select" id="c-style" list="style-presets" placeholder="普普通通" maxlength="6" oninput="updateCreatePreview()"><datalist id="style-presets"><option value="沉默寡言"><option value="普普通通"><option value="絮絮叨叨"><option value="温温柔柔"></datalist></div></div>
    </div>
    <div class="create-preview" id="create-preview">
      <div class="create-preview-avatar" id="create-preview-avatar" style="background:rgba(96,165,250,.1);color:#60a5fa">🗡</div>
      <div class="create-preview-info">预览：<strong id="create-preview-name">新意识体</strong><br><span id="create-preview-role">村民</span></div>
    </div>

  });

function injectGPUDisplacement(mesh){

    mesh.userData.shader=shader;mesh.userData.hasGPU=true;
  };
}

function getEventTags(event){

  if(event.type==='gossip_spread')tags.push('#gossip','#conflict');
  if(event.type==='help_action')tags.push('#help','#cooperate');

// 根据NPC性格与标签契合度计算偏差 — 用于感知者自发反应
function getTagBias(npc,tags,aid){
  var bias=0;var a=ACTIONS[aid];if(!a)return 0;
  tags.forEach(function(tag){
    var tc=TAG_CATEGORIES[tag];if(!tc||!tc.traits)return;
    for(var k in tc.traits){
      if(npc.personality[k]!==undefined){
        // 性格与标签的契合度 × 行为权重
        bias+=npc.personality[k]*tc.traits[k]*.02*(a.traits[k]||0);
      }
    }
  });
  return bias;
}

// 语义理解管线：提取关键词→激活概念→性格加权→形成理解
function understandEvent(npc,event){

  // 1. 提取关键词
  var keywords=[];
  for(var word in SEMANTIC_MAP){if(text.indexOf(word)>=0)keywords.push(word);}
  // 字符级回退：当词级匹配为空时，用单字匹配探测

    var charDanger={火:1,灾:1,死:1,血:1,杀:1,毒:1,炸:1,爆:1,毁:1,灭:1,亡:1,逃:1,跑:1,喊:1,叫:1,救:1,病:1,伤:1,痛:1,鬼:1,妖:1,怪:1,贼:1,盗:1,偷:1,抢:1,打:1,斗:1,战:1,狼:1,虎:1,蛇:1,兽:1,崩:1,塌:1,裂:1,断:1};

    var dangerScore=0,urgencyScore=0,sadScore=0,curiosityScore=0;
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(charDanger[ch])dangerScore+=charDanger[ch];
      if(charUrgency[ch])urgencyScore+=charUrgency[ch];
      if(charSad[ch])sadScore+=charSad[ch];
      if(charCuriosity[ch])curiosityScore+=charCuriosity[ch];

    if(urgencyScore>0)fallbackConcepts.push('紧急');

    if(curiosityScore>0)fallbackConcepts.push('未知');
    if(fallbackConcepts.length===0)fallbackConcepts.push('日常');
    var domEmo='';var maxEmo2=0;
    for(var e in fallbackEmo){if(fallbackEmo[e]>maxEmo2){maxEmo2=fallbackEmo[e];domEmo=e;}}
    // 激活概念（使用性格透镜加权）
    var conceptAct2={};
    fallbackConcepts.forEach(function(c){conceptAct2[c]=(conceptAct2[c]||0)+1;});
    for(var trait in PERSONALITY_LENS){
      var weight2=p[trait]/100;
      var lens2=PERSONALITY_LENS[trait];
      for(var concept2 in lens2){
        if(conceptAct2[concept2]!==undefined){conceptAct2[concept2]+=lens2[concept2]*weight2;}
      }
    }
    conceptAct2=applyMoodFilter(conceptAct2,npc);
    var topConcepts2=Object.keys(conceptAct2).filter(function(c){return conceptAct2[c]>0;}).sort(function(a,b){return conceptAct2[b]-conceptAct2[a];}).slice(0,4);
    var conceptMap2={暴力:'有暴力发生',伤害:'有人受伤了',痛苦:'有人很痛苦',危险:'有危险',未知:'情况不明',冲突:'起了冲突',不公:'这不公平',犯罪:'有人在作恶',财富:'跟钱有关',援助:'需要帮忙',悲伤:'很悲伤',恐惧:'让人害怕',损失:'有损失',社交:'跟人打交道',消息:'有新消息',搜寻:'在找什么',异常:'不太对劲',威胁:'有威胁',机会:'可能有好处',外来者:'有外人来了',脆弱:'有人很脆弱',合作:'需要合作',交易:'有交易',黑暗:'环境危险',聚集:'人多的地方',日常:'日常小事',神秘:'很神秘',紧急:'事情紧急',秘密:'有秘密',权威:'涉及权威',资源:'涉及资源',失去:'有所失去',不变:'很平常',灾难:'重大灾难发生了',破坏:'破坏性事件',疾病:'有人生病了',野兽:'有野兽出没',英雄:'需要英雄站出来',终结:'已经结束了',仪式:'有仪式',逃避:'有人在逃避',安全:'安全第一',希望:'有希望',冒险:'有风险',自由:'自由了',不受控:'失控了',分离:'分开了',归属:'归属感',远处:'远处发生了事',自然:'自然的力量',屏障:'有屏障'};
    var interpretation2=topConcepts2.length>0?topConcepts2.map(function(c){return conceptMap2[c]||c;}).join('，'):'发生了什么事';
    return {keywords:keywords,concepts:topConcepts2,dominantEmotion:domEmo,emotionAct:fallbackEmo,interpretation:interpretation2,subject:extractSubject(text),fallback:true};
  }
  // 2. 激活概念+情绪
  var conceptAct={};var emotionAct={};

    var sem=SEMANTIC_MAP[kw];if(!sem)return;
    sem.concepts.forEach(function(c){conceptAct[c]=(conceptAct[c]||0)+1;});
